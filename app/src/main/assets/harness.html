    async _openAIStream(messages, config, onToken) {
      this._abort = new AbortController();
      const base = (config.endpoint || '').replace(/\/+$/, '');
      const url = base + '/v1/chat/completions';

      const body = {
        model: config.model || 'local',
        messages,
        temperature: config.temperature,
        top_p: config.topP,
        max_tokens: config.maxTokens,
        stream: true,
      };

      let resp;
      try {
        resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: this._abort.signal,
        });
      } catch (e) {
        throw new HarnessError('LLM_NETWORK', 'Network error: ' + e.message, { url });
      }
      if (!resp.ok) {
        const t = await resp.text().catch(() => '');
        throw new HarnessError('LLM_HTTP', 'HTTP ' + resp.status + ': ' + t.slice(0, 200), { url });
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';
      while (true) {
        if (this._abortFlag) { try { reader.cancel(); } catch (_) {} throw new HarnessError('LLM_ABORTED', 'aborted'); }
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) { full += delta; onToken(delta); }
          } catch (_) {}
        }
      }
      return full;
    },
  };

  H.ResponseParser = {
    parse(raw) {
      const errors = [];

      raw = raw.replace(/<\|(?:begin_of_text|end_of_text|start_header_id|end_header_id|eot_id|im_start|im_end|end_of_turn|start_of_turn)\|>/g, '');
      raw = raw.replace(/<\/?s>\s*/g, '');

      const card = H.CharacterCardLoader.getActive();
      if (card && card.name) {
        const esc = card.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        raw = raw.replace(new RegExp('^\\s*' + esc + '\\s*:?\\s*', 'i'), '');
      }

      const m = raw.match(/\[STATE\]([\s\S]*?)\[\/STATE\]/);
      if (!m) {
        errors.push('PARSER_NO_STATE');
        return { dialogue: raw.trim(), stateDelta: null, raw, parseErrors: errors };
      }
      const dialogue = raw.replace(m[0], '').trim();
      let jsonish = m[1].trim();
      jsonish = jsonish.replace(/:\s*\+(\d+(?:\.\d+)?)/g, ': {"__delta":true,"amount":$1}');

      let parsed = null;
      try {
        parsed = JSON.parse(jsonish);
      } catch (e) {
        errors.push('PARSER_BAD_JSON');
        parsed = this.repairJSON(jsonish);
        if (parsed) errors.push('PARSER_REPAIRED');
      }
      return { dialogue, stateDelta: parsed, raw, parseErrors: errors };
    },

    repairJSON(jsonish) {
      const s = jsonish.replace(/'/g, '"').replace(/,\s*([}\]])/g, '$1');
      try { return JSON.parse(s); } catch (_) { return null; }
    },
  };

  /* =========================================================================
   * 8. MULTI-PASS ENGINE + ANTI-LOOP DETECTOR
   * ========================================================================= */

  H.MultiPassEngine = {
    buildPlanPrompt(state, history, card, userInput) {
      const name = (card && card.name) || 'the character';
      const recent = history.slice(-6).map(m => m.role + ': ' + m.content).join('\n');
      return [
        'You are a scene planner. Analyze the conversation and output ONLY a JSON object.',
        'Do not write dialogue or narration — only the plan.',
        '',
        'Character: ' + name,
        'Current state: ' + JSON.stringify(state),
        'Recent transcript:',
        recent,
        'Latest user message: ' + userInput,
        '',
        'Output format (strict JSON, no prose, no markdown fences):',
        '{"does":"brief physical action for the character",',
        ' "says":"brief topic of what the character will say",',
        ' "tone":"emotional tone of this beat",',
        ' "advances":"what moves forward in this turn"}',
      ].join('\n');
    },

    parseJSONish(text) {
      const cleaned = (text || '').replace(/^```(?:json)?|```$/g, '').trim();
      try { return JSON.parse(cleaned); }
      catch (_) { return H.ResponseParser.repairJSON(cleaned); }
    },
  };

  H.StateClassifier = {
    buildPrompt(reply) {
      return [
        'You are a state classifier. Read the roleplay reply below and output',
        'ONLY a JSON object describing the assistant character\'s current state.',
        '',
        'Output format:',
        '{"mood":"neutral|happy|sad|angry|wary|warm",',
        ' "action":"one or two words, present participle, or empty string"}',
        '',
        'Rules:',
        '- Use only the listed mood values.',
        '- Action is 1-2 words, present participle, or empty string.',
        '- No prose. No markdown. No explanation. No code fences.',
        '',
        'Reply to classify:',
        reply,
      ].join('\n');
    },

    parse(text) {
      const cleaned = (text || '').replace(/^```(?:json)?|```$/g, '').trim();
      let j = null;
      try { j = JSON.parse(cleaned); }
      catch (_) { j = H.ResponseParser.repairJSON(cleaned); }
      if (!j || typeof j !== 'object') return null;
      return {
        mood:   String(j.mood   || '').toLowerCase().trim(),
        action: String(j.action || '').toLowerCase().trim(),
      };
    },
  };

  H.AntiLoopDetector = {
    BUFFER_SIZE: 5,
    _recent: [],
    _pendingCorrection: null,
    CORRECTIONS: {
      opening_repeat: 'Vary your opening. Do not begin with the same structure as previous responses.',
      suffix_replay:  'Do not repeat earlier phrasing. Advance the scene.',
    },
    seed(text) {
      const t = (text || '').trim();
      if (t) {
        this._recent.push(t);
        if (this._recent.length > this.BUFFER_SIZE) this._recent.shift();
      }
    },

    check(newOutput) {
      const reasons = [];
      let correction = null;
      const out = (newOutput || '').trim();
      if (out.length > 0) {
        const opening = out.slice(0, 40).toLowerCase();
        for (const prev of this._recent) {
          if ((prev || '').trim().toLowerCase().slice(0, 40) === opening) {
            reasons.push('opening_repeat');
            correction = this.CORRECTIONS.opening_repeat;
            break;
          }
        }
        if (!correction) {
          const suffix = out.slice(-60).toLowerCase();
          for (const prev of this._recent) {
            if ((prev || '').trim().toLowerCase().slice(-60) === suffix) {
              reasons.push('suffix_replay');
              correction = this.CORRECTIONS.suffix_replay;
              break;
            }
          }
        }
        this._recent.push(out);
        if (this._recent.length > this.BUFFER_SIZE) this._recent.shift();
      }
      return { looping: reasons.length > 0, reasons, correction };
    },
    stashCorrection(c) { this._pendingCorrection = c; },
    consumeCorrection() { const c = this._pendingCorrection; this._pendingCorrection = null; return c; },
    reset() { this._recent = []; this._pendingCorrection = null; },
  };

  H.CompactionEngine = {
    _running: false,
    _log: [],
    async maybeCompact(turnCount, history, state) {
      const cfg = H.ConfigManager.getAll();
      const interval = Math.max(1, cfg.compactionInterval | 0);
      if (turnCount === 0 || turnCount % interval !== 0) return;
      if (this._running) return;
      this._running = true;
      try {
        const prompt = this.buildCompactionPrompt(history, state);
        const messages = [
          { role: 'system', content: 'You are a state compactor. Reply with a single JSON object only.' },
          { role: 'user', content: prompt },
        ];
        const raw = await H.LLMClient.generate(messages, cfg);
        let snapshot;
        try { snapshot = JSON.parse(raw.trim().replace(/^```(?:json)?|```$/g, '').trim()); }
        catch (_) { snapshot = H.ResponseParser.repairJSON(raw); }
        if (!snapshot) throw new HarnessError('COMPACT_BAD_JSON', 'compaction returned non-JSON');
        this.mergeSnapshot(snapshot);
        this._log.push({ ts: Date.now(), turnCount });
        H.bus.emit(H.EVENTS.STATE_COMPACTED, { turnCount, snapshot });
      } catch (e) {
        H.Logger.log('warn', 'CompactionEngine', e.code || 'COMPACT_ERR', e.message);
      } finally { this._running = false; }
    },
    buildCompactionPrompt(history, state) {
      const recent = history.slice(-12).map(m => m.role + ': ' + m.content).join('\n');
      return [
        'Current state:', JSON.stringify(state), '',
        'Recent transcript:', recent, '',
        'Produce an updated state JSON with the same keys. Absolute values only.',
      ].join('\n');
    },
    mergeSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;
      const clean = {};
      for (const k of Object.keys(H.StateManager.DEFAULTS)) {
        if (k in snapshot) clean[k] = snapshot[k];
      }
      H.StateManager.applySnapshot(clean);
    },
  };
  /* =========================================================================
   * 10. TURN CONTROLLER
   * ========================================================================= */

  H.SceneStore = {
    MAX_EXCHANGES: 3,

    _key(cardId) { return H.STORAGE.SCENES + '.' + cardId; },

    listForCard(cardId) {
      if (!cardId) return [];
      const arr = H.storage.get(this._key(cardId), []) || [];
      return arr.filter(s => s && s.id && Array.isArray(s.exchanges));
    },

    get(cardId, sceneId) {
      return this.listForCard(cardId).find(s => s.id === sceneId) || null;
    },

    save(cardId, scene) {
      if (!cardId || !scene || !scene.id) return null;
      const arr = this.listForCard(cardId);
      const idx = arr.findIndex(s => s.id === scene.id);
      if (idx !== -1) arr[idx] = scene; else arr.push(scene);
      H.storage.set(this._key(cardId), arr);
      return scene;
    },

    delete(cardId, sceneId) {
      const arr = this.listForCard(cardId).filter(s => s.id !== sceneId);
      H.storage.set(this._key(cardId), arr);
    },

    newId() {
      return 'scene-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
    },

    blankExchanges() {
      return [{ user: '', assistant: '' }];
    },

    estimateTokens(scene) {
      if (!scene || !Array.isArray(scene.exchanges)) return 0;
      let chars = 0;
      for (const ex of scene.exchanges) {
        chars += (ex.user || '').length;
        chars += (ex.assistant || '').length;
      }
      return Math.ceil(chars / 4);
    },
  };

  H.TurnController = {
    _history: [],
    _busy: false,
    _lastRawStream: '',

    async init() {
      H.ConfigManager.load();
      H.StateManager.load();
      H.CharacterCardLoader.loadFromStorage();
      this._history = H.storage.get(H.STORAGE.HISTORY, []) || [];

      // Guarantee an active card exists
      if (!H.CharacterCardLoader.getActive()) {
        H.CharacterCardLoader.setActiveById('nisa');
      }

      H.UIController.init();
      H.DebugPanel.init();

      const card = H.CharacterCardLoader.getActive();
      if (this._history.length === 0 && card && card.firstMessage) {
        this._history.push({ role: 'assistant', content: card.firstMessage });
        this._persistHistory();
        H.AntiLoopDetector.seed(card.firstMessage);
      }

      H.UIController.renderChat(this._history);
      H.UIController.renderStateView(H.StateManager.get());
      H.UIController.updateStatus(H.StateManager.get());
      H.UIController._renderSettings();
      H.UIController._renderMoodBar();
      H.UIController.renderPortrait();
      H.UIController.setBusy(false);

      // Attempt to load bundled default portrait (e.g. Nisa's) if missing
      const activeId = H.CharacterCardLoader.getActiveId();
      if (activeId) {
        H.CharacterCardLoader.loadBundledPortraitIfMissing(activeId).then(() => {
          H.UIController.renderPortrait();
          H.UIController._renderSettings();
        });
      }
    },

    async submit(userInput) {
      if (this._busy) throw new HarnessError('BUSY', 'turn in progress');
      if (!userInput || !userInput.trim()) return null;

      this._busy = true;
      H.UIController.setBusy(true);
      H.bus.emit(H.EVENTS.TURN_START, { userInput });

      try {
        const cfg = H.ConfigManager.getAll();
        const card = H.CharacterCardLoader.getActive();
        if (!card) throw new HarnessError('CARD_MISSING', 'no active card');

        this._history.push({ role: 'user', content: userInput });
        H.UIController.appendMessage('user', userInput);

      const correction = H.AntiLoopDetector.consumeCorrection();

      // Optional planning pass. Runs before the writing pass, produces a
      // short JSON plan, and injects it into the system prompt.
      let plan = null;
      if (cfg.planningEnabled) {
        H.UIController.showThinking('planning…');
        plan = await this._runPlanningPass(card, cfg, userInput);
        H.Logger.log('info', 'MultiPass', 'plan_generated', plan);
      }

      const { messages, debug } = H.PromptAssembler.assemble(
        H.StateManager.get(), this._history, card, userInput,
        { pendingCorrection: correction, plan: plan, config: cfg }
      );

      this._lastRawStream = '';
      H.UIController.hideThinking();
      H.UIController.beginAssistantStream();
      const raw = await H.LLMClient.generateStream(messages, cfg, (tok) => {
          this._lastRawStream += tok;
          H.UIController.appendStreamingToken(tok);
        });

        const parsed = H.ResponseParser.parse(raw);

        let loop = { looping: false, reasons: [], correction: null };
        if (cfg.loopCheckEnabled) {
          loop = H.AntiLoopDetector.check(parsed.dialogue);
          if (loop.looping) {
            H.AntiLoopDetector.stashCorrection(loop.correction);
            H.bus.emit(H.EVENTS.LOOP_DETECTED, loop);
          }
        }

        if (parsed.stateDelta) H.StateManager.applyUpdate(parsed.stateDelta);

        // Reply is complete — settle the bubble before the classifier runs.
        H.UIController.endAssistantStream();

        // Optional state classifier pass. Reads the reply and overrides
        // mood/action with a cleaner read of what actually happened.
        if (cfg.stateClassifierEnabled && parsed.dialogue) {
          H.UIController.showThinking('classifying…');
          const classified = await this._runStateClassifier(parsed.dialogue, cfg);
          H.UIController.hideThinking();
          if (classified) {
            if (classified.mood)   H.StateManager.setField('mood', classified.mood);
            if (classified.action) H.StateManager.setField('action', classified.action);
            H.Logger.log('info', 'StateClassifier', 'applied', classified);
          }
        }

        if (cfg.compactionEnabled) {
          H.CompactionEngine.maybeCompact(
            H.StateManager.get().turnCount, this._history, H.StateManager.get()
          ).catch(e => H.Logger.log('error', 'CompactionEngine', e.code || 'ERR', e.message));
        }

        this._history.push({ role: 'assistant', content: parsed.dialogue });
        const st = H.StateManager.get();
        st.turnCount += 1;
        H.StateManager.setField('turnCount', st.turnCount);
        this._persistHistory();

        H.UIController.endAssistantStream();
        H.UIController.renderChat(this._history);
        H.UIController.renderStateView(H.StateManager.get());
        H.UIController.updateStatus(H.StateManager.get());
        H.DebugPanel.render({
          messages, prompt: messages, parse: parsed, loop,
          state: st, config: cfg, debug,
        });

        H.bus.emit(H.EVENTS.TURN_COMPLETE, { turnCount: st.turnCount });
        return { dialogue: parsed.dialogue, raw, parse: parsed, state: st };

      } catch (e) {
        if (e && e.code === 'LLM_ABORTED') {
          this._finalizeAborted();
          return null;
        }
        H.bus.emit(H.EVENTS.TURN_ERROR, e);
        let pending = null;
        if (this._history.length && this._history[this._history.length - 1].role === 'user') {
          pending = this._history.pop();
        }
        this._persistHistory();
        H.UIController.showError(e.code ? (e.code + ': ' + e.message) : e.message);
        H.UIController.hideThinking();
        H.UIController.endAssistantStream();
        H.UIController.renderChat(this._history);
        if (pending) {
          H.UIController._els.input.value = pending.content;
          H.UIController._els.input.focus();
        }
        throw e;
      } finally {
        this._busy = false;
        H.UIController.setBusy(false);
      }
    },

    stop() { H.LLMClient.abort(); },

    _finalizeAborted() {
      const partial = (this._lastRawStream || '').trim();
      if (partial) {
        const parsed = H.ResponseParser.parse(partial);
        if (parsed.stateDelta) H.StateManager.applyUpdate(parsed.stateDelta);
        this._history.push({ role: 'assistant', content: parsed.dialogue || '(stopped)' });
        const st = H.StateManager.get();
        st.turnCount += 1;
        H.StateManager.setField('turnCount', st.turnCount);
      } else if (this._history.length && this._history[this._history.length - 1].role === 'user') {
        this._history.pop();
      }
      this._persistHistory();
      H.UIController.hideThinking();
      H.UIController.endAssistantStream();
      H.UIController.renderChat(this._history);
      H.UIController.renderStateView(H.StateManager.get());
      H.UIController.updateStatus(H.StateManager.get());
      H.bus.emit(H.EVENTS.TURN_COMPLETE, { aborted: true });
    },

    async regenerate() {
      if (this._busy) return;
      if (this._history.length && this._history[this._history.length - 1].role === 'assistant') {
        this._history.pop();
      }
      let lastUser = null;
      if (this._history.length && this._history[this._history.length - 1].role === 'user') {
        lastUser = this._history.pop();
      }
      if (!lastUser) { H.UIController.renderChat(this._history); return; }
      this._persistHistory();
      H.UIController.renderChat(this._history);
      try { await this.submit(lastUser.content); } catch (_) {}
    },

       async newChat(opts) {
      if (this._busy) return;
      opts = opts || {};

      // Picker path: no explicit scene, not forced → open picker modal
      if (!opts.force && !('scene' in opts)) {
        H.UIController.openScenePicker();
        return;
      }

      this._history = [];
      H.StateManager.reset();
      H.AntiLoopDetector.reset();
      H.CompactionEngine._running = false;
      H.CompactionEngine._log = [];
      H.UIController.endAssistantStream();

      const card = H.CharacterCardLoader.getActive();

      // If a scene is specified, push its exchanges as real history.
      // Otherwise fall back to the card's greeting.
      if (opts.scene && Array.isArray(opts.scene.exchanges) && opts.scene.exchanges.length) {
        for (const ex of opts.scene.exchanges) {
          if (ex.user && ex.user.trim()) {
            this._history.push({ role: 'user', content: ex.user.trim() });
          }
          if (ex.assistant && ex.assistant.trim()) {
            this._history.push({ role: 'assistant', content: ex.assistant.trim() });
          }
        }
        // Seed the loop detector with the scene's last assistant message
        // so any later echo of it gets caught.
        for (let i = this._history.length - 1; i >= 0; i--) {
          if (this._history[i].role === 'assistant') {
            H.AntiLoopDetector.seed(this._history[i].content);
            break;
          }
        }
      } else if (card && card.firstMessage) {
        this._history.push({ role: 'assistant', content: card.firstMessage });
        H.AntiLoopDetector.seed(card.firstMessage);
      }

      this._persistHistory();
      H.UIController.renderChat(this._history);
      H.UIController.renderStateView(H.StateManager.get());
      H.UIController.updateStatus(H.StateManager.get());
      H.UIController.renderPortrait();
      H.UIController._els.input.value = '';
      H.UIController._els.input.focus();
      H.DebugPanel.render({
        messages: [], prompt: [], parse: { parseErrors: [] }, loop: {},
        state: H.StateManager.get(), config: H.ConfigManager.getAll(),
        debug: { sections: [], truncations: [], totalTokens: 0, capTokens: 0 },
      });
    },

    async _runPlanningPass(card, cfg, userInput) {
      const plannerSystem =
        'You are a scene planner for roleplay. Output ONLY a JSON object with keys ' +
        '"does", "says", "tone", "advances". No prose. No markdown fences.';
      const planPrompt = H.MultiPassEngine.buildPlanPrompt(
        H.StateManager.get(), this._history, card, userInput
      );
      const planMessages = [
        { role: 'system', content: plannerSystem },
        { role: 'user', content: planPrompt },
      ];
      const planCfg = Object.assign({}, cfg, {
        temperature: cfg.planTemperature,
        maxTokens:   cfg.planMaxTokens,
      });
      try {
        const raw = await H.LLMClient.generate(planMessages, planCfg);
        return H.MultiPassEngine.parseJSONish(raw);
      } catch (e) {
        H.Logger.log('warn', 'MultiPass', 'plan_failed', e.message);
        return null;
      }
    },

    async _runStateClassifier(reply, cfg) {
      const systemMsg =
        'You are a state classifier. Output ONLY a JSON object. ' +
        'No prose. No markdown fences. No explanation.';
      const userMsg = H.StateClassifier.buildPrompt(reply);
      const messages = [
        { role: 'system', content: systemMsg },
        { role: 'user', content: userMsg },
      ];
      const classCfg = Object.assign({}, cfg, {
        temperature: cfg.classifierTemperature,
        maxTokens:   cfg.classifierMaxTokens,
      });
      try {
        const raw = await H.LLMClient.generate(messages, classCfg);
        return H.StateClassifier.parse(raw);
      } catch (e) {
        H.Logger.log('warn', 'StateClassifier', 'classify_failed', e.message);
        return null;
      }
    },

    async reset() { return this.newChat(); },
    getHistory() { return this._history.slice(); },
    _persistHistory() { H.storage.set(H.STORAGE.HISTORY, this._history); },
    setHistory(h) { this._history = h.slice(); this._persistHistory(); },
  };

  H.UIController = {
    _els: {},
    _streamVisible: '',
    _streamPending: '',
    _suppressing: false,
    _streamBubble: null,
    _thinkingBubble: null,
    _previewedCardId: null,   // which card the settings panel is showing
    _draftPortrait: null,     // portrait held in memory for a new/unsaved card
    _isDraftMode: false,      // true after clicking New, until Save or Load
    _editingScene: null,      // working copy of the scene being edited
    _editingSceneId: null,    // null when creating new, id when editing existing
    _sceneEditorFromPicker: false,
    _followBottom: true,

    MOOD_BASE: ['neutral', 'happy', 'sad', 'angry', 'wary', 'warm'],
    SILHOUETTE: 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="#1a1a1a"/>' +
      '<circle cx="50" cy="40" r="16" fill="#333"/>' +
      '<path d="M20 90 Q20 60 50 60 Q80 60 80 90 Z" fill="#333"/>' +
      '</svg>'
  ),
    init() {
      this._els = {
        chat:        document.getElementById('chat'),
        input:       document.getElementById('input'),
        send:        document.getElementById('send'),
        stop:        document.getElementById('stop'),
        regenerate:  document.getElementById('regenerate'),
        newchat:     document.getElementById('newchat'),
        stateView:   document.getElementById('state-view'),
        statusLine:  document.getElementById('status-line'),
        debugToggle: document.getElementById('debug-toggle'),
        debugPanel:  document.getElementById('debug-panel'),
        settings:    document.getElementById('settings'),
        moodSelect:  document.getElementById('mood-select'),
        moodClear:   document.getElementById('mood-clear'),
        moodDelete:  document.getElementById('mood-delete'),
        moodCustomInput:  document.getElementById('mood-custom-input'),
        moodCustomSave:   document.getElementById('mood-custom-save'),
        moodCustomCancel: document.getElementById('mood-custom-cancel'),
      };

      this._els.send.addEventListener('click', () => this._onSend());
      this._els.stop.addEventListener('click', () => H.TurnController.stop());
      this._els.newchat.addEventListener('click', () => H.TurnController.newChat());
      this._els.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._onSend(); }
      });
      this._els.regenerate.addEventListener('click', () => H.TurnController.regenerate());
      this._els.debugToggle.addEventListener('click', () => H.DebugPanel.toggle());

      // Scene picker
      document.getElementById('scene-picker-close')
        .addEventListener('click', () => this.closeScenePicker());
      document.getElementById('scene-blank')
        .addEventListener('click', () => {
          this.closeScenePicker();
          H.TurnController.newChat({ force: true });
        });
            document.getElementById('scene-new')
        .addEventListener('click', () => {
          this.closeScenePicker();
          this.openSceneEditor(null, { fromPicker: true });
        });

      // Scene editor
      document.getElementById('scene-editor-close')
        .addEventListener('click', () => this._sceneEditorCancel());
      document.getElementById('scene-editor-cancel')
        .addEventListener('click', () => this._sceneEditorCancel());
      document.getElementById('scene-editor-save')
        .addEventListener('click', () => this._sceneEditorSave());
      document.getElementById('scene-editor-delete')
        .addEventListener('click', () => this._sceneEditorDelete());
      document.getElementById('scene-editor-add')
        .addEventListener('click', () => this._sceneEditorAddExchange());
      document.getElementById('scene-editor-remove')
        .addEventListener('click', () => this._sceneEditorRemoveLast());

      // Mood UI
      this._els.moodSelect.addEventListener('change', () => this._onMoodSelect());
      this._els.moodClear.addEventListener('click', () => {
        H.ConfigManager.set('desiredMood', '');
        this._renderMoodBar();
      });
      this._els.moodDelete.addEventListener('click', () => this._onMoodDelete());
      this._els.moodCustomSave.addEventListener('click', () => this._saveCustomMood());
      this._els.moodCustomCancel.addEventListener('click', () => this._cancelCustomMood());
      this._els.moodCustomInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); this._saveCustomMood(); }
        if (e.key === 'Escape') { e.preventDefault(); this._cancelCustomMood(); }
      });

      // Portrait
      const portraitEl   = document.getElementById('portrait');
      const portraitImg  = document.getElementById('portrait-img');
      const portraitFile = document.getElementById('portrait-file');
      this._els.portrait     = portraitEl;
      this._els.portraitImg  = portraitImg;
      this._els.portraitFile = portraitFile;
      portraitEl.addEventListener('click', () => portraitFile.click());
      portraitFile.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        this._setPortraitFromFile(f);
        e.target.value = '';
      });
      this.renderPortrait();

      H.bus.on(H.EVENTS.TURN_START, () => this.setBusy(true));
      H.bus.on(H.EVENTS.TURN_COMPLETE, () => this.setBusy(false));
      H.bus.on(H.EVENTS.TURN_ERROR, () => this.setBusy(false));
      H.bus.on(H.EVENTS.STATE_UPDATED, ({ after }) => {
        this.renderStateView(after);
        this.updateStatus(after);
      });

      const ui = H.storage.get(H.STORAGE.UI, {}) || {};
      if (ui.debugVisible) H.DebugPanel.show();

      this._els.chat.addEventListener('scroll', () => {
        const el = this._els.chat;
        this._followBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
      }, { passive: true });
    },

    /* ---------- Mood UI (Goal 6) ---------- */

    _renderMoodBar() {
      const sel = this._els.moodSelect;
      if (!sel) return;
      this._hideCustomMoodInput();

      const cur = H.ConfigManager.get('desiredMood') || '';
      const customs = H.ConfigManager.get('customMoods') || [];
      const baseSet = new Set(this.MOOD_BASE);

      sel.innerHTML = '';

      const optNone = document.createElement('option');
      optNone.value = ''; optNone.textContent = '— none —';
      if (!cur) optNone.selected = true;
      sel.appendChild(optNone);

      for (const m of this.MOOD_BASE) {
        const o = document.createElement('option');
        o.value = m; o.textContent = m;
        if (m === cur) o.selected = true;
        sel.appendChild(o);
      }

      if (customs.length) {
        const sep = document.createElement('option');
        sep.disabled = true; sep.textContent = '── custom ──';
        sel.appendChild(sep);
        for (const m of customs) {
          const o = document.createElement('option');
          o.value = m; o.textContent = m;
          if (m === cur) o.selected = true;
          sel.appendChild(o);
        }
      }

      const optCustom = document.createElement('option');
      optCustom.value = '__custom__'; optCustom.textContent = '+ custom…';
      sel.appendChild(optCustom);

      this._els.moodClear.style.display = cur ? '' : 'none';
      const isCustom = cur && !baseSet.has(cur);
      this._els.moodDelete.style.display = isCustom ? '' : 'none';
    },

    _onMoodSelect() {
      const v = this._els.moodSelect.value;
      if (v === '__custom__') {
        this._showCustomMoodInput();
        return;
      }
      H.ConfigManager.set('desiredMood', v);
      this._renderMoodBar();
    },

    _showCustomMoodInput() {
      this._els.moodSelect.style.display = 'none';
      this._els.moodClear.style.display = 'none';
      this._els.moodDelete.style.display = 'none';
      this._els.moodCustomInput.style.display = '';
      this._els.moodCustomSave.style.display = '';
      this._els.moodCustomCancel.style.display = '';
      this._els.moodCustomInput.value = '';
      try { this._els.moodCustomInput.focus(); } catch (_) {}
    },

    _hideCustomMoodInput() {
      this._els.moodCustomInput.style.display = 'none';
      this._els.moodCustomSave.style.display = 'none';
      this._els.moodCustomCancel.style.display = 'none';
      this._els.moodSelect.style.display = '';
    },

    _saveCustomMood() {
      const raw = this._els.moodCustomInput.value;
      const trimmed = raw ? raw.trim().toLowerCase().slice(0, 30) : '';
      if (trimmed) {
        const moods = H.ConfigManager.get('customMoods') || [];
        if (moods.indexOf(trimmed) === -1 && this.MOOD_BASE.indexOf(trimmed) === -1) {
          moods.push(trimmed);
          H.ConfigManager.set('customMoods', moods);
        }
        H.ConfigManager.set('desiredMood', trimmed);
      }
      this._renderMoodBar();
    },

    _cancelCustomMood() { this._renderMoodBar(); },

    _onMoodDelete() {
      const cur = H.ConfigManager.get('desiredMood') || '';
      if (!cur) return;
      const moods = (H.ConfigManager.get('customMoods') || []).filter(m => m !== cur);
      H.ConfigManager.set('customMoods', moods);
      H.ConfigManager.set('desiredMood', '');
      this._renderMoodBar();
    },

    /* ---------- Input / send ---------- */

    async _onSend() {
      const text = this._els.input.value;
      if (!text || !text.trim()) return;
      this._els.input.value = '';
      this._followBottom = true;
      try { await H.TurnController.submit(text); } catch (_) {}
    },

    _maybeScrollToBottom() {
      if (!this._followBottom) return;
      const el = this._els.chat;
      el.scrollTop = el.scrollHeight;
    },

    _renderText(text) {
      const esc = String(text == null ? '' : text).replace(/[&<>"]/g,
        c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
      return esc
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    },

    updateStatus(state) {
      if (!this._els.statusLine) return;
      const hist = H.TurnController.getHistory();
      const cfg = H.ConfigManager.getAll();
      const turns = (state && state.turnCount) || 0;
      const tokens = H.PromptAssembler.estimateTokens(
        hist.map(m => ({ role: m.role, content: m.content }))
      );
      const cap = cfg.contextLimit - cfg.maxTokens;
      const ratio = cap > 0 ? tokens / cap : 0;
      this._els.statusLine.textContent =
        `turn ${turns} · ~${tokens} / ${cap} tokens · ${hist.length} messages`;
      this._els.statusLine.classList.toggle('warn', ratio >= 0.75 && ratio < 0.9);
      this._els.statusLine.classList.toggle('danger', ratio >= 0.9);
    },

    renderChat(history) {
      const el = this._els.chat;
      el.innerHTML = '';
      this._streamBubble = null;
      for (const m of history) this.appendMessage(m.role, m.content);
      el.scrollTop = el.scrollHeight;
      this._els.input.focus();
      this.updateStatus(H.StateManager.get());
    },

    appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = this._renderText(text);
      if (role === 'assistant') {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '⧉';
        btn.title = 'Copy';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const clone = div.cloneNode(true);
          clone.querySelectorAll('.copy-btn').forEach(b => b.remove());
          const plain = clone.textContent;
          const done = () => { btn.textContent = '✓'; setTimeout(() => { btn.textContent = '⧉'; }, 1200); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(plain).then(done).catch(() => {});
          } else {
            const ta = document.createElement('textarea');
            ta.value = plain; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (_) {}
            ta.remove();
          }
        });
        div.appendChild(btn);
      }
      this._els.chat.appendChild(div);
      this._maybeScrollToBottom();
      return div;
    },

    showThinking(label) {
      if (this._thinkingBubble) {
        this._thinkingBubble.textContent = label || 'thinking…';
        return;
      }
      const el = document.createElement('div');
      el.className = 'msg thinking';
      el.textContent = label || 'thinking…';
      this._els.chat.appendChild(el);
      this._thinkingBubble = el;
      this._maybeScrollToBottom();
    },

    hideThinking() {
      if (!this._thinkingBubble) return;
      this._thinkingBubble.remove();
      this._thinkingBubble = null;
    },

    beginAssistantStream() {
      this._streamVisible = '';
      this._streamPending = '';
      this._suppressing = false;
      this._streamBubble = this.appendMessage('assistant', '');
      this._streamBubble.classList.add('streaming');
    },

    endAssistantStream() {
      if (this._streamBubble) {
        if (!this._suppressing && this._streamPending) {
          this._streamVisible += this._streamPending;
          this._streamPending = '';
        }
        this._streamBubble.classList.remove('streaming');
        this._streamBubble.innerHTML = this._renderText(this._streamVisible);
      }
      this._streamBubble = null;
      this._streamVisible = '';
      this._streamPending = '';
      this._suppressing = false;
    },

    appendStreamingToken(token) {
      const OPEN = '[STATE]', CLOSE = '[/STATE]';
      for (const ch of token) {
        this._streamPending += ch;
        if (this._suppressing) {
          if (this._streamPending.endsWith(CLOSE)) {
            this._streamPending = '';
            this._suppressing = false;
          } else if (this._streamPending.length > CLOSE.length) {
            this._streamPending = this._streamPending.slice(-CLOSE.length);
          }
        } else {
          if (this._streamPending.endsWith(OPEN)) {
            const before = this._streamPending.slice(0, -OPEN.length);
            this._streamVisible += before;
            this._streamPending = '';
            this._suppressing = true;
          } else if (this._streamPending.length > OPEN.length) {
            const flush = this._streamPending.slice(0, -OPEN.length);
            this._streamVisible += flush;
            this._streamPending = this._streamPending.slice(-OPEN.length);
          }
        }
      }
      this._renderStreamingBubble(this._streamVisible);
    },

    _renderStreamingBubble(text) {
      if (!this._streamBubble) return;
      this._streamBubble.innerHTML = this._renderText(text);
      this._maybeScrollToBottom();
    },

    setBusy(busy) {
      this._els.input.disabled = busy;
      this._els.send.disabled = busy;
      this._els.regenerate.disabled = busy;
      this._els.newchat.disabled = busy;
      this._els.moodSelect.disabled = busy;
      this._els.stop.style.display = busy ? '' : 'none';
      this._els.send.style.display = busy ? 'none' : '';
      if (!busy) try { this._els.input.focus(); } catch (_) {}
    },

    showError(message) {
      const el = document.createElement('div');
      el.className = 'msg system';
      el.textContent = '⚠ ' + message;
      this._els.chat.appendChild(el);
      this._els.chat.scrollTop = this._els.chat.scrollHeight;
      setTimeout(() => { el.style.transition = 'opacity 0.4s'; el.style.opacity = '0.4'; }, 4000);
    },

    renderStateView(state) {
      this._els.stateView.textContent = JSON.stringify(state, null, 0);
    },

    /* ---------- Portrait (Goal 1) ---------- */

    renderPortrait() {
      const card = H.CharacterCardLoader.getActive();
      const el  = this._els.portrait;
      const img = this._els.portraitImg;
      if (!card || !card.id) {
        img.removeAttribute('src');
        el.classList.remove('has-image');
        return;
      }
      const data = H.CharacterCardLoader.getPortraitForId(card.id);
      if (data) {
        img.src = data;
        el.classList.add('has-image');
      } else {
        img.src = this.SILHOUETTE;
        el.classList.add('has-image');
      }
    },

    _setPortraitFromFile(file) {
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) return;
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 512;
          let w = img.width, h = img.height;
          const scale = Math.min(1, MAX / Math.max(w, h));
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL('image/jpeg', 0.85);
          try {
            H.CharacterCardLoader.setPortraitForId(card.id, data);
            this._previewedCardId = card.id;
            this._isDraftMode = false;
            this.renderPortrait();
            this._renderSettings();
          } catch (e) {
            alert('Portrait too large to store. Try a smaller image.');
          }
        };
        img.onerror = () => alert('Could not read that image.');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    },

    _deleteActivePortrait() {
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) return;
      if (!confirm('Delete this portrait?')) return;
      const ok = H.CharacterCardLoader.deletePortraitForId(card.id);
      if (!ok) {
        alert("This portrait is locked and can't be deleted.");
        return;
      }
      this.renderPortrait();
      this._renderSettings();
    },

    /* ---------- Settings (Goal 1 + Goal 6) ---------- */

        _getPreviewPortrait() {
      if (this._isDraftMode) return this._draftPortrait || this.SILHOUETTE;
      const id = this._previewedCardId;
      if (!id) return this.SILHOUETTE;
      return H.CharacterCardLoader.getPortraitForId(id) || this.SILHOUETTE;
    },

    _getPreviewCard() {
      if (this._isDraftMode) return null;
      return H.CharacterCardLoader.getCardById(this._previewedCardId);
    },

    _setPreviewPortrait(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 512;
          let w = img.width, h = img.height;
          const scale = Math.min(1, MAX / Math.max(w, h));
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL('image/jpeg', 0.85);

          if (this._isDraftMode) {
            this._draftPortrait = data;
          } else if (this._previewedCardId) {
            H.CharacterCardLoader.setPortraitForId(this._previewedCardId, data);
            if (this._previewedCardId === H.CharacterCardLoader.getActiveId()) {
              this.renderPortrait();
            }
          }
          this._renderSettings();
        };
        img.onerror = () => alert('Could not read that image.');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    },

    _clearPreviewPortrait() {
      if (this._isDraftMode) {
        this._draftPortrait = null;
        this._renderSettings();
        return;
      }
      const id = this._previewedCardId;
      if (!id) return;
      const card = H.CharacterCardLoader.getCardById(id);
      if (!card) return;

      const current = H.CharacterCardLoader.getPortraitForId(id);

      if (card.portraitLocked) {
        if (!current) return;
        if (!confirm('Reset this portrait back to the default?')) return;
        H.storage.remove('harness.portrait.' + id);
        H.CharacterCardLoader.loadBundledPortraitIfMissing(id).then(() => {
          if (id === H.CharacterCardLoader.getActiveId()) this.renderPortrait();
          this._renderSettings();
        });
        return;
      }

      if (!confirm('Delete this portrait?')) return;
      H.CharacterCardLoader.deletePortraitForId(id);
      if (id === H.CharacterCardLoader.getActiveId()) this.renderPortrait();
      this._renderSettings();
    },

        _openPreviewPortraitPicker() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) this._setPreviewPortrait(f);
      };
      input.click();
    },

    /* ---------- Scene picker (Goal 5) ---------- */

    openScenePicker() {
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) return;
      this._renderSceneList();
      document.getElementById('scene-picker').style.display = 'flex';
    },

    closeScenePicker() {
      document.getElementById('scene-picker').style.display = 'none';
    },

    _renderSceneList() {
      const card = H.CharacterCardLoader.getActive();
      const listEl = document.getElementById('scene-list');
      listEl.innerHTML = '';
      if (!card || !card.id) return;

      const scenes = H.SceneStore.listForCard(card.id);
      for (const scene of scenes) {
        const btn = document.createElement('button');
        btn.className = 'scene-row';
        const tok = H.SceneStore.estimateTokens(scene);

        const nameEl = document.createElement('div');
        nameEl.className = 'scene-row-name';
        nameEl.textContent = scene.name || 'Untitled scene';
        btn.appendChild(nameEl);

        const metaEl = document.createElement('div');
        metaEl.className = 'scene-row-meta';
        const nEx = scene.exchanges.length;
        metaEl.textContent = nEx + ' exchange' + (nEx === 1 ? '' : 's') +
                            ' · ~' + tok + ' tokens' +
                            (scene.shareable ? ' · shareable' : '');
        btn.appendChild(metaEl);

        btn.addEventListener('click', () => {
          this.closeScenePicker();
          H.TurnController.newChat({ force: true, scene: scene });
        });

        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          this.closeScenePicker();
          this.openSceneEditor(scene.id, { fromPicker: true });
        });

        listEl.appendChild(btn);
      }
    },

        /* ---------- Scene editor (Goal 5, part 2) ---------- */

    openSceneEditor(sceneId, opts) {
      opts = opts || {};
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) { alert('No active character.'); return; }

      this._sceneEditorFromPicker = !!opts.fromPicker;

      if (sceneId) {
        const existing = H.SceneStore.get(card.id, sceneId);
        if (!existing) { alert('Scene not found.'); return; }
        this._editingSceneId = sceneId;
        this._editingScene = JSON.parse(JSON.stringify(existing));
      } else {
        this._editingSceneId = null;
        this._editingScene = {
          id: H.SceneStore.newId(),
          name: '',
          shareable: true,
          exchanges: H.SceneStore.blankExchanges(),
        };
      }

      this._renderSceneEditor();
      document.getElementById('scene-editor').style.display = 'flex';
    },

    closeSceneEditor() {
      document.getElementById('scene-editor').style.display = 'none';
      const fromPicker = this._sceneEditorFromPicker;
      this._editingScene = null;
      this._editingSceneId = null;
      this._sceneEditorFromPicker = false;
      return fromPicker;
    },

    _renderSceneEditor() {
      const s = this._editingScene;
      if (!s) return;

      document.getElementById('scene-editor-title').textContent =
        this._editingSceneId ? 'Edit scene' : 'New scene';
      document.getElementById('scene-editor-name').value = s.name || '';
      document.getElementById('scene-editor-shareable').checked = !!s.shareable;

      const delBtn = document.getElementById('scene-editor-delete');
      delBtn.style.visibility = this._editingSceneId ? 'visible' : 'hidden';

      const container = document.getElementById('scene-editor-exchanges');
      container.innerHTML = '';

      const card = H.CharacterCardLoader.getActive();
      const charName = (card && card.name) || 'Character';
      const userName = (H.ConfigManager.get('userCharacterName') || '').trim() || 'You';

      s.exchanges.forEach((ex, idx) => {
        const block = document.createElement('div');
        block.className = 'exchange-block';

        const head = document.createElement('div');
        head.className = 'exchange-head';
        head.textContent = 'Exchange ' + (idx + 1);
        block.appendChild(head);

        // User row
        const userRow = document.createElement('div');
        userRow.className = 'exchange-row';
        const userLabel = document.createElement('div');
        userLabel.className = 'exchange-role exchange-role-user';
        userLabel.textContent = userName;
        userRow.appendChild(userLabel);
        const userArea = document.createElement('textarea');
        userArea.value = ex.user || '';
        userArea.maxLength = 600;
        userArea.placeholder = 'What ' + userName + ' says or does…';
        userArea.addEventListener('input', () => {
          s.exchanges[idx].user = userArea.value;
          this._updateSceneEstimate();
        });
        userRow.appendChild(userArea);
        block.appendChild(userRow);

        // Assistant row
        const asstRow = document.createElement('div');
        asstRow.className = 'exchange-row';
        const asstLabel = document.createElement('div');
        asstLabel.className = 'exchange-role exchange-role-assistant';
        asstLabel.textContent = charName;
        asstRow.appendChild(asstLabel);
        const asstArea = document.createElement('textarea');
        asstArea.value = ex.assistant || '';
        asstArea.maxLength = 600;
        asstArea.placeholder = 'What ' + charName + ' says or does…';
        asstArea.addEventListener('input', () => {
          s.exchanges[idx].assistant = asstArea.value;
          this._updateSceneEstimate();
        });
        asstRow.appendChild(asstArea);
        block.appendChild(asstRow);

        container.appendChild(block);
      });

      this._updateSceneEstimate();
    },

    _updateSceneEstimate() {
      const s = this._editingScene;
      if (!s) return;
      const tok = H.SceneStore.estimateTokens(s);
      const el = document.getElementById('scene-editor-estimate');
      let text = '~' + tok + ' tokens';
      let cls = 'hint';
      if (tok > 500) {
        cls = 'hint scene-over-limit';
        text += ' — too heavy for the phone';
      } else if (tok > 250) {
        text += ' — getting heavy for the phone';
      } else {
        text += ' — fits comfortably';
      }
      el.className = cls;
      el.textContent = text;
    },

    _sceneEditorAddExchange() {
      if (!this._editingScene) return;
      if (this._editingScene.exchanges.length >= H.SceneStore.MAX_EXCHANGES) {
        alert('Maximum ' + H.SceneStore.MAX_EXCHANGES + ' exchanges per scene.');
        return;
      }
      this._editingScene.exchanges.push({ user: '', assistant: '' });
      this._renderSceneEditor();
    },

    _sceneEditorRemoveLast() {
      if (!this._editingScene) return;
      if (this._editingScene.exchanges.length <= 1) {
        alert('A scene needs at least one exchange.');
        return;
      }
      this._editingScene.exchanges.pop();
      this._renderSceneEditor();
    },

    _sceneEditorSave() {
      const s = this._editingScene;
      if (!s) return;
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) { alert('No active character.'); return; }

      const name = (document.getElementById('scene-editor-name').value || '').trim();
      if (!name) { alert('Please give the scene a name.'); return; }

      const hasContent = s.exchanges.some(
        ex => (ex.user || '').trim() || (ex.assistant || '').trim()
      );
      if (!hasContent) { alert('At least one exchange needs content.'); return; }

      s.name = name.slice(0, 80);
      s.shareable = !!document.getElementById('scene-editor-shareable').checked;

      H.SceneStore.save(card.id, s);
      const back = this.closeSceneEditor();
      if (back) this.openScenePicker();
    },

    _sceneEditorCancel() {
      const back = this.closeSceneEditor();
      if (back) this.openScenePicker();
    },

    _sceneEditorDelete() {
      if (!this._editingSceneId) return;
      const card = H.CharacterCardLoader.getActive();
      if (!card || !card.id) return;
      if (!confirm('Delete this scene?')) return;
      H.SceneStore.delete(card.id, this._editingSceneId);
      const back = this.closeSceneEditor();
      if (back) this.openScenePicker();
    },

    /* ---------- Settings (Goal 1 + Goal 6) ---------- */

    _renderSettings() {
      const el = this._els.settings;
      const prevDetails = el.querySelector('details');
      const wasOpen = prevDetails ? prevDetails.open : false;
      el.innerHTML = '';
      const details = document.createElement('details');
      details.open = wasOpen;
      const summary = document.createElement('summary');
      summary.textContent = '⚙ Settings';
      details.appendChild(summary);

      // Default preview to active card if not set
      if (!this._isDraftMode && !this._previewedCardId) {
        this._previewedCardId = H.CharacterCardLoader.getActiveId();
      }

      /* ======== CHARACTER SECTION ======== */

      const charHead = document.createElement('div');
      charHead.className = 'section-head';
      charHead.textContent = 'Character';
      details.appendChild(charHead);

      const allCards = H.CharacterCardLoader.getAllCards();
      const previewedCard = this._isDraftMode
        ? null
        : H.CharacterCardLoader.getCardById(this._previewedCardId);

      const picker = document.createElement('select');
      picker.id = 'card-picker';
      const draftOpt = document.createElement('option');
      draftOpt.value = '__draft__';
      draftOpt.textContent = '— New character (draft) —';
      if (this._isDraftMode) draftOpt.selected = true;
      picker.appendChild(draftOpt);

      for (const c of allCards) {
        const o = document.createElement('option');
        o.value = c.id;
        let label = c.name;
        if (c.locked) label += ' ★';
        else if (c.isCustom) label += ' ·';
        o.textContent = label;
        if (!this._isDraftMode && previewedCard && previewedCard.id === c.id) o.selected = true;
        picker.appendChild(o);
      }
      details.appendChild(picker);

      // Portrait row
      const portraitRow = document.createElement('div');
      portraitRow.className = 'card-row';

      const preview = document.createElement('div');
      preview.className = 'card-preview';
      const previewPortrait = this._getPreviewPortrait();
      if (previewPortrait) {
        const im = document.createElement('img');
        im.src = previewPortrait;
        preview.appendChild(im);
      }
      portraitRow.appendChild(preview);

      const portraitActions = document.createElement('div');
      portraitActions.className = 'card-actions-col';

      const uploadBtn = document.createElement('button');
      uploadBtn.textContent = 'Upload portrait';
      uploadBtn.addEventListener('click', () => this._openPreviewPortraitPicker());
      portraitActions.appendChild(uploadBtn);

      const deletePortraitBtn = document.createElement('button');
      deletePortraitBtn.textContent = 'Delete portrait';
      deletePortraitBtn.className = 'danger';
      const hasPortrait = previewPortrait && previewPortrait !== this.SILHOUETTE;
      if (!hasPortrait) deletePortraitBtn.disabled = true;
      deletePortraitBtn.addEventListener('click', () => this._clearPreviewPortrait());
      portraitActions.appendChild(deletePortraitBtn);

      portraitRow.appendChild(portraitActions);
      details.appendChild(portraitRow);

      // Textarea
      const cardArea = document.createElement('textarea');
      cardArea.style.marginTop = '8px';
      if (this._isDraftMode || !previewedCard) {
        cardArea.value = JSON.stringify(H.CharacterCardLoader.BLANK_TEMPLATE, null, 2);
      } else {
        // previewedCard.data holds the actual card fields; the wrapper
        // carries metadata like id, locked, isCustom.
        const dataForEdit = Object.assign({}, previewedCard.data, {
          exampleDialogue: (previewedCard.data && previewedCard.data.exampleDialogue) || '',
          exportable: previewedCard.exportable,
        });
        cardArea.value = JSON.stringify(dataForEdit, null, 2);
      }
      details.appendChild(cardArea);

      const cardHint = document.createElement('div');
      cardHint.className = 'hint';
      cardHint.textContent = 'Fields: name, systemPrompt, firstMessage. Optional: exampleDialogue, exportable.';
      details.appendChild(cardHint);

      // Actions
      const actions = document.createElement('div');
      actions.id = 'card-actions';
      const btn = (label, fn, cls) => {
        const b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.addEventListener('click', fn);
        return b;
      };

      // New — enter draft mode
      actions.appendChild(btn('New', () => {
        this._isDraftMode = true;
        this._draftPortrait = null;
        this._renderSettings();
      }));

      // Load — parse and activate
      actions.appendChild(btn('Load', () => {
        try {
          const parsed = JSON.parse(cardArea.value);
          const card = H.CharacterCardLoader.load(parsed);
          const nameMatch = allCards.find(c => c.name === card.name);

          if (nameMatch) {
            H.CharacterCardLoader.setActiveById(nameMatch.id);
          } else {
            const entry = H.CharacterCardLoader.saveCustomCard(parsed, null);
            if (this._draftPortrait) {
              H.CharacterCardLoader.setPortraitForId(entry.id, this._draftPortrait);
            }
            H.CharacterCardLoader.setActiveById(entry.id);
          }

          this._isDraftMode = false;
          this._draftPortrait = null;
          this._previewedCardId = H.CharacterCardLoader.getActiveId();
          H.UIController.renderPortrait();
          H.UIController.renderChat(H.TurnController.getHistory());
          H.TurnController.newChat({ force: true });
        } catch (e) { alert('Load failed: ' + e.message); }
      }));

      // Save
      actions.appendChild(btn('Save', () => {
        try {
          const parsed = JSON.parse(cardArea.value);
          let targetId = null;
          let displayName = parsed.name;

          if (this._isDraftMode) {
            const entry = H.CharacterCardLoader.saveCustomCard(parsed, null);
            if (this._draftPortrait) {
              H.CharacterCardLoader.setPortraitForId(entry.id, this._draftPortrait);
            }
            targetId = entry.id;
            this._isDraftMode = false;
            this._draftPortrait = null;
          } else if (previewedCard && previewedCard.isCustom) {
            const entry = H.CharacterCardLoader.saveCustomCard(parsed, previewedCard.id);
            targetId = entry.id;
          } else if (previewedCard && previewedCard.locked) {
            parsed.name = (parsed.name || 'Unnamed') + ' (copy)';
            const entry = H.CharacterCardLoader.saveCustomCard(parsed, null);
            targetId = entry.id;
            displayName = parsed.name;
          } else {
            alert('Nothing to save.');
            return;
          }

          if (H.CharacterCardLoader.getActiveId() === targetId) {
            H.CharacterCardLoader.setActiveById(targetId);
          }
          this._previewedCardId = targetId;
          this._renderSettings();
          if (H.CharacterCardLoader.getActiveId() === targetId) {
            this.renderPortrait();
          }
          alert('Saved: ' + displayName);
        } catch (e) { alert('Save failed: ' + e.message); }
      }));

      // Delete
      const delBtn = btn('Delete', () => {
        if (!previewedCard) return;
        if (previewedCard.locked) return;
        if (!confirm('Delete "' + previewedCard.name + '"?\nThis also removes its portrait. Cannot be undone.')) return;
        const wasActive = H.CharacterCardLoader.getActiveId() === previewedCard.id;
        const ok = H.CharacterCardLoader.deleteCustomCard(previewedCard.id);
        if (!ok) { alert("Can't delete this card."); return; }
        this._previewedCardId = H.CharacterCardLoader.getActiveId();
        this._renderSettings();
        if (wasActive) {
          this.renderPortrait();
          H.TurnController.newChat({ force: true });
        }
      }, 'danger');
      if (!previewedCard || previewedCard.locked) delBtn.disabled = true;
      actions.appendChild(delBtn);

      details.appendChild(actions);

      // Export / Import
      const fileActions = document.createElement('div');
      fileActions.id = 'card-actions';
      fileActions.style.marginTop = '6px';

      fileActions.appendChild(btn('Export this', () => {
        if (!previewedCard) { alert('No card selected to export.'); return; }
        H.ExportManager.exportSingleCard(previewedCard.id);
      }));

      fileActions.appendChild(btn('Export all', () => H.ExportManager.exportToFile()));

      fileActions.appendChild(btn('Import', () => {
        H.ExportManager.importFromFile()
          .then(() => { this._previewedCardId = H.CharacterCardLoader.getActiveId(); })
          .catch(e => alert('Import failed: ' + e.message));
      }));

      details.appendChild(fileActions);

      // Picker change → update preview
      picker.addEventListener('change', () => {
        const id = picker.value;
        if (id === '__draft__') {
          this._isDraftMode = true;
          this._draftPortrait = null;
          this._renderSettings();
          return;
        }
        this._isDraftMode = false;
        this._previewedCardId = id;
        this._renderSettings();
      });

      /* ======== CONFIG GRID ======== */

      const cfgHead = document.createElement('div');
      cfgHead.className = 'section-head';
      cfgHead.textContent = 'Generation';
      details.appendChild(cfgHead);

      const grid = document.createElement('div');
      grid.className = 'grid';

      const cfg = H.ConfigManager.getAll();
      const fields = [
        ['Backend',          'backend',             'select', ['mock', 'native', 'openai']],
        ['Chat template',    'chatTemplate',        'select', ['llama3', 'chatml', 'plain']],
        ['Endpoint',         'endpoint',            'text',   null],
        ['Model',            'model',               'text',   null],
        ['Mock scenario',    'mockScenario',        'select', Object.keys(H.LLMClient.MOCK_RESPONSES)],
        ['Temperature',      'temperature',         'number', { step: 0.05, min: 0, max: 2 }],
        ['Top P',            'topP',                'number', { step: 0.05, min: 0, max: 1 }],
        ['Max tokens',       'maxTokens',           'number', { step: 10, min: 16, max: 2048 }],
        ['Verbatim turns',   'verbatimTurns',       'number', { step: 1, min: 0, max: 20 }],
        ['Context limit',    'contextLimit',        'number', { step: 100, min: 400, max: 8192 }],
        ['Merge sys msgs',   'mergeSystemMessages', 'checkbox', null],
        ['Name prefix',      'namePosePrefix',      'checkbox', null],
        ['Loop check',       'loopCheckEnabled',    'checkbox', null],
        ['Compaction',       'compactionEnabled',   'checkbox', null],
        ['State classifier', 'stateClassifierEnabled', 'checkbox', null],
        ['Planning pass',    'planningEnabled',     'checkbox', null],

        ['Load-time — change triggers model reload', '__perf__', 'divider', null],
        ['Context window',   'nCtx',                'number', { step: 128, min: 512, max: 2048 }],
        ['Threads',          'nThreads',            'number', { step: 1, min: 2, max: 8 }],
        ['Batch size',       'nBatch',              'number', { step: 64, min: 128, max: 512 }],
      ];

      for (const [label, key, type, extra] of fields) {
        if (type === 'divider') {
          const d = document.createElement('div');
          d.style.gridColumn = '1 / -1';
          d.style.borderTop = '1px solid #333';
          d.style.paddingTop = '10px';
          d.style.marginTop = '6px';
          d.style.color = '#888';
          d.style.fontSize = '0.72rem';
          d.textContent = label;
          grid.appendChild(d);
          continue;
        }

        const lab = document.createElement('label');
        lab.textContent = label;
        grid.appendChild(lab);
        let inp;
        if (type === 'select') {
          inp = document.createElement('select');
          for (const opt of extra) {
            const o = document.createElement('option');
            o.value = opt; o.textContent = opt;
            inp.appendChild(o);
          }
          inp.value = cfg[key];
        } else if (type === 'checkbox') {
          inp = document.createElement('input');
          inp.type = 'checkbox';
          inp.checked = !!cfg[key];
        } else {
          inp = document.createElement('input');
          inp.type = type;
          if (extra) {
            if (extra.step !== undefined) inp.step = extra.step;
            if (extra.min !== undefined) inp.min = extra.min;
            if (extra.max !== undefined) inp.max = extra.max;
          }
          inp.value = cfg[key];
        }
        inp.addEventListener('change', () => {
          let v;
          if (type === 'checkbox') v = inp.checked;
          else if (type === 'number') v = Number(inp.value);
          else v = inp.value;
          H.ConfigManager.set(key, v);
        });
        grid.appendChild(inp);
      }

      details.appendChild(grid);
      el.appendChild(details);
    },
  };

  H.DebugPanel = {
    _els: {},
    _last: null,
    _visible: false,
    init() { this._els.panel = document.getElementById('debug-panel'); },
    render(payload) {
      this._last = payload;
      if (!this._visible) return;
      this._paint();
    },
    _paint() {
      const el = this._els.panel;
      if (!el) return;
      const p = this._last || {};
      const d = p.debug || { sections: [], truncations: [], totalTokens: 0, capTokens: 0 };
      const lines = [];
      lines.push('=== TURN DEBUG ===');
      lines.push('tokens: ' + d.totalTokens + ' / cap ' + d.capTokens);
      if (d.namePrefix) lines.push('name prefix: "' + d.namePrefix + ' "');
      lines.push('');
      lines.push('Sections:');
      for (const s of d.sections) {
        lines.push('  ' + s.name + ': ' + s.tokens + 't' + (s.trimmed ? ' (trimmed)' : ''));
      }
      if (d.truncations && d.truncations.length) {
        lines.push('');
        lines.push('Truncations:');
        for (const t of d.truncations) lines.push('  - ' + JSON.stringify(t));
      }
      lines.push('');
      lines.push('Parse errors: ' + ((p.parse && p.parse.parseErrors && p.parse.parseErrors.join(', ')) || 'none'));
      lines.push('');
      lines.push('State delta: ' + JSON.stringify(p.parse && p.parse.stateDelta));
      lines.push('Loop: ' + JSON.stringify(p.loop || {}));
      lines.push('');
      lines.push('Messages:');
      for (const m of (p.messages || [])) {
        const c = (m.content || '');
        lines.push('[' + m.role + '] ' + (c.length > 400 ? c.slice(0, 400) + '…' : c));
        lines.push('');
      }
      el.textContent = lines.join('\n');
    },
    show() {
      this._visible = true;
      this._els.panel.style.display = 'block';
      this._paint();
      const ui = H.storage.get(H.STORAGE.UI, {}) || {};
      ui.debugVisible = true; H.storage.set(H.STORAGE.UI, ui);
    },
    hide() {
      this._visible = false;
      this._els.panel.style.display = 'none';
      const ui = H.storage.get(H.STORAGE.UI, {}) || {};
      ui.debugVisible = false; H.storage.set(H.STORAGE.UI, ui);
    },
    toggle() { this._visible ? this.hide() : this.show(); },
  };

  H.ExportManager = {
    FORMAT_VERSION: 2,

    /* Export everything exportable (cards, current state, history, portraits, scenes) */
    export() {
      const cards = [];
      for (const c of H.CharacterCardLoader.getAllCards()) {
        if (!c.exportable) continue;
        const portrait = H.CharacterCardLoader.getPortraitForId(c.id);
        const scenes = H.SceneStore.listForCard(c.id).filter(s => s.shareable);
        cards.push({
          id: c.id,
          name: c.name,
          data: c.data,
          portrait: portrait || null,
          scenes: scenes,
        });
      }

      // Include current active card even if it's a built-in (for context)
      const active = H.CharacterCardLoader.getActive();
      const activeId = H.CharacterCardLoader.getActiveId();

      // Scene backup for the active card. Included regardless of the card's
      // own exportable flag, because scenes are user-authored content, not
      // part of the shipped character.
      const activeScenes = activeId
        ? H.SceneStore.listForCard(activeId).filter(s => s.shareable)
        : [];

      return {
        formatVersion: this.FORMAT_VERSION,
        kind: 'bundle',
        exportedAt: new Date().toISOString(),
        config: H.ConfigManager.getAll(),
        state: H.StateManager.get(),
        activeCardId: activeId,
        activeCard: active ? { name: active.name, data: active._raw } : null,
        activeScenes: activeScenes,
        cards,
        history: H.TurnController.getHistory(),
      };
    },

    /* Export a single card + its portrait + its shareable scenes + current chat state */
    exportSingleCard(cardId) {
      const card = H.CharacterCardLoader.getCardById(cardId);
      if (!card) throw new HarnessError('EXPORT_INVALID', 'Card not found');
      const portrait = H.CharacterCardLoader.getPortraitForId(cardId);
      const scenes = H.SceneStore.listForCard(cardId).filter(s => s.shareable);
      const payload = {
        formatVersion: this.FORMAT_VERSION,
        kind: 'character',
        exportedAt: new Date().toISOString(),
        card: { id: card.id, name: card.name, data: card.data },
        portrait: portrait || null,
        scenes: scenes,
      };
      this._download(payload, 'character-' + (card.name || 'unnamed').replace(/\s+/g,'-') + '.json');
    },

    /**
     * Restore a list of scenes into the SceneStore under the given card ID.
     * Overwrites any scene with a matching ID (so re-imports update cleanly).
     * Returns the number of scenes imported.
     */
    _importScenesForCard(cardId, scenes) {
      if (!Array.isArray(scenes)) return 0;
      let count = 0;
      for (const s of scenes) {
        if (!s || !s.id || !Array.isArray(s.exchanges)) continue;
        const cleaned = {
          id: String(s.id),
          name: String(s.name || 'Imported scene').slice(0, 80),
          shareable: s.shareable !== false,
          exchanges: s.exchanges
            .slice(0, H.SceneStore.MAX_EXCHANGES)
            .map(ex => ({
              user:      String((ex && ex.user)      || '').slice(0, 600),
              assistant: String((ex && ex.assistant) || '').slice(0, 600),
            })),
        };
        H.SceneStore.save(cardId, cleaned);
        count++;
      }
      return count;
    },

    _download(payload, filename) {
      const data = JSON.stringify(payload, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || ('harness-export-' + Date.now() + '.json');
      document.body.appendChild(a);
            a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },

    import(blob) {
      if (!blob || typeof blob !== 'object')
        throw new HarnessError('IMPORT_INVALID', 'not an object');
      if (blob.formatVersion !== this.FORMAT_VERSION)
        throw new HarnessError('IMPORT_INVALID', 'format version mismatch');

      let sceneCount = 0;

      if (blob.kind === 'bundle') {
        if (blob.config) {
          Object.assign(H.ConfigManager._config, blob.config);
          H.ConfigManager.save();
          H.bus.emit(H.EVENTS.CONFIG_CHANGED, { imported: true });
        }
        if (blob.state) H.StateManager.applySnapshot(blob.state);
        const customs = H.storage.get(H.STORAGE.CARDS, []) || [];
        if (Array.isArray(blob.cards)) {
          for (const c of blob.cards) {
            if (c.id === 'nisa') continue;
            const idx = customs.findIndex(x => x.id === c.id);
            const entry = { id: c.id, name: c.name || 'Imported', data: c.data };
            if (idx !== -1) customs[idx] = entry; else customs.push(entry);
            if (c.portrait) H.CharacterCardLoader.setPortraitForId(c.id, c.portrait);
            if (Array.isArray(c.scenes)) {
              sceneCount += this._importScenesForCard(c.id, c.scenes);
            }
          }
          H.storage.set(H.STORAGE.CARDS, customs);
        }
        if (blob.activeCardId && H.CharacterCardLoader.getCardById(blob.activeCardId))
          H.CharacterCardLoader.setActiveById(blob.activeCardId);
        if (Array.isArray(blob.history)) H.TurnController.setHistory(blob.history);
        // Restore active-card scenes (works for built-in cards like Nisa,
        // whose card data isn't part of the bundle).
        if (blob.activeCardId && Array.isArray(blob.activeScenes)) {
          sceneCount += this._importScenesForCard(blob.activeCardId, blob.activeScenes);
        }
      } else if (blob.kind === 'character') {
        if (!blob.card || !blob.card.id)
          throw new HarnessError('IMPORT_INVALID', 'character payload missing card');
        const customs = H.storage.get(H.STORAGE.CARDS, []) || [];
        const idx = customs.findIndex(x => x.id === blob.card.id);
        const entry = { id: blob.card.id, name: blob.card.name || 'Imported', data: blob.card.data };
        if (idx !== -1) customs[idx] = entry; else customs.push(entry);
        H.storage.set(H.STORAGE.CARDS, customs);
        if (blob.portrait) H.CharacterCardLoader.setPortraitForId(blob.card.id, blob.portrait);
        if (Array.isArray(blob.scenes)) {
          sceneCount += this._importScenesForCard(blob.card.id, blob.scenes);
        }
      } else {
        throw new HarnessError('IMPORT_INVALID', 'unknown kind: ' + blob.kind);
      }

      H.UIController.renderChat(H.TurnController.getHistory());
      H.UIController.renderStateView(H.StateManager.get());
      H.UIController.updateStatus(H.StateManager.get());
      H.UIController.renderPortrait();
      H.UIController._renderSettings();
      H.UIController._renderMoodBar();

      if (sceneCount > 0) {
        setTimeout(() => alert('Imported ' + sceneCount + ' scene' +
          (sceneCount === 1 ? '' : 's') + '.'), 100);
      }
    },

    exportToFile() {
      this._download(this.export(), 'harness-export-' + Date.now() + '.json');
    },

    async importFromFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      const file = await new Promise((res) => {
        input.onchange = () => res(input.files && input.files[0]);
        input.click();
      });
      if (!file) return;
      const text = await file.text();
      let blob;
      try { blob = JSON.parse(text); }
      catch (e) { throw new HarnessError('IMPORT_INVALID', 'not JSON'); }
      this.import(blob);
    },

    async loadFromUrl(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new HarnessError('IMPORT_HTTP', 'HTTP ' + resp.status);
      const blob = await resp.json();
      this.import(blob);
    },
  };

  document.addEventListener('DOMContentLoaded', () => {
    H.TurnController.init().catch(e => {
      console.error('Bootstrap failed', e);
      alert('Bootstrap failed: ' + (e && e.message ? e.message : e));
    });
  });
</script>
</body>
