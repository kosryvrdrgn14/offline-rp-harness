<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Harness (rev 5 — Goal 1)</title>
  <style>
    #portrait {
      width: 96px; height: 96px; border-radius: 50%;
      background: #222; border: 1px solid #444;
      cursor: pointer; overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.5rem; user-select: none;
    }
    #portrait img {
      width: 100%; height: 100%; object-fit: cover; display: none;
    }
    #portrait.has-image img { display: block; }
    #portrait.has-image #portrait-hint { display: none; }
    #portrait-hint {
      color: #555; font-size: 0.7rem; text-align: center;
      pointer-events: none; padding: 0 8px; line-height: 1.2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; margin: 0; padding: 0.5rem;
      background: #111; color: #eee; -webkit-text-size-adjust: 100%;
    }
    #chat {
      min-height: 40vh; max-height: 55vh; border: 1px solid #333;
      padding: 0.5rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .msg {
      padding: 0.5rem 0.7rem; border-radius: 8px; max-width: 88%;
      white-space: pre-wrap; word-wrap: break-word; line-height: 1.35;
      position: relative;
    }
    .msg.user { background: #1e3a5f; align-self: flex-end; }
    .msg.assistant { background: #2a2a2a; align-self: flex-start; }

    .msg.system { background: #333; font-style: italic; font-size: 0.85rem; opacity: 0.85; align-self: center; max-width: 100%; }
    .msg.thinking {
      background: #1a1a2a; color: #89a; font-style: italic;
      align-self: flex-start; font-size: 0.85rem;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1.0; }
    }
    .msg em { color: #cbd; font-style: italic; }
    .msg strong { color: #fff; font-weight: 600; }
    .msg .copy-btn {
      float: right; opacity: 0.35; cursor: pointer; margin-left: 8px;
      font-size: 0.75rem; background: transparent; border: 0; color: inherit;
      padding: 0 4px; line-height: 1;
    }
    .msg .copy-btn:hover { opacity: 1; }
    .msg.streaming::after {
      content: '▍'; margin-left: 2px; color: #6cf;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    #input { flex: 1 1 200px; min-width: 0; padding: 0.45rem;
             background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
    button {
      padding: 0.45rem 0.8rem; background: #2a2a2a; color: #eee;
      border: 1px solid #444; border-radius: 4px; cursor: pointer;
      font: inherit;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #stop { background: #4a2020; border-color: #833; }
    #newchat { background: #2a1e1e; border-color: #633; }
    button.danger { background: #3a1e1e; border-color: #633; }

    #mood-bar {
      display: flex; gap: 0.35rem; align-items: center;
      margin-top: 0.4rem; font-size: 0.8rem; flex-wrap: wrap;
    }
    #mood-bar .mood-label { color: #888; }
    #mood-select {
      flex: 0 1 auto; min-width: 110px; max-width: 200px;
      padding: 0.25rem 0.4rem; background: #222; color: #eee;
      border: 1px solid #444; border-radius: 4px; font-size: 0.8rem;
    }
    #mood-custom-input {
      flex: 0 1 150px;
      padding: 0.25rem 0.4rem; background: #222; color: #eee;
      border: 1px solid #555; border-radius: 4px; font-size: 0.8rem;
    }
    #mood-custom-save, #mood-custom-cancel,
    #mood-clear, #mood-delete {
      padding: 0.2rem 0.55rem; font-size: 0.8rem; line-height: 1;
    }
    #mood-custom-save { background: #1e3a2a; border-color: #4a7; }
    #mood-custom-cancel { background: #2a2a2a; }
    #mood-clear { background: #2a2a2a; }
    #mood-delete { background: #3a1e1e; border-color: #633; }

    #status-line {
      margin-top: 0.4rem; font-family: monospace; font-size: 0.75rem;
      color: #888; min-height: 1em;
    }
    #status-line.warn { color: #fc6; }
    #status-line.danger { color: #f66; }

    #state-view {
      margin-top: 0.5rem; font-family: monospace; font-size: 0.8rem;
      white-space: pre-wrap; word-break: break-all; color: #999;
    }
    #debug-panel {
      margin-top: 0.5rem; border: 1px solid #333; padding: 0.5rem;
      display: none; font-family: monospace; font-size: 0.8rem;
      white-space: pre-wrap; max-height: 40vh; overflow-y: auto;
    }
    #settings { margin-top: 0.5rem; border: 1px solid #333; padding: 0.5rem; border-radius: 4px; }
    #settings summary { cursor: pointer; user-select: none; }
    #settings .grid {
      display: grid; grid-template-columns: 150px 1fr;
      gap: 6px; margin-top: 8px; align-items: center;
    }
    #settings input, #settings select, #settings textarea {
      background: #222; color: #eee; border: 1px solid #444;
      padding: 0.3rem 0.4rem; font-family: inherit; border-radius: 3px;
      font-size: 0.85rem; width: 100%;
    }
    #settings textarea {
      height: 100px; font-family: monospace; font-size: 0.75rem;
      resize: vertical;
    }
    #card-actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .hint { color: #888; font-size: 0.75rem; margin-top: 6px; }

    .section-head {
      font-size: 0.75rem; color: #888; text-transform: uppercase;
      letter-spacing: 0.6px; margin: 14px 0 6px 0; border-bottom: 1px solid #2a2a2a;
      padding-bottom: 4px;
    }
    .section-head:first-child { margin-top: 4px; }

    .card-row {
      display: flex; align-items: center; gap: 8px; margin-top: 6px;
      flex-wrap: wrap;
    }
    .card-row .card-preview {
      width: 56px; height: 56px; border-radius: 50%;
      background: #1a1a1a; border: 1px solid #333;
      overflow: hidden; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      color: #444; font-size: 0.7rem;
    }
    .card-row .card-preview img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .card-row .card-actions-col {
      display: flex; flex-direction: column; gap: 4px;
    }
    .badge {
      display: inline-block; font-size: 0.65rem;
      padding: 1px 6px; border-radius: 8px;
      background: #2a2a3a; color: #aac; margin-left: 6px;
      vertical-align: middle;
    }
    .badge.locked { background: #3a2a1e; color: #caa; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 1rem;
    }
    .modal-panel {
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
      max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 1rem; border-bottom: 1px solid #333; font-weight: 600;
    }
    .modal-header button {
      background: #333; border: 1px solid #444; color: #eee;
      padding: 0.3rem 0.7rem; border-radius: 4px; cursor: pointer;
    }
    .modal-body { padding: 1rem; }
    .modal-actions {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;
    }

    .scene-row {
      display: block; width: 100%; text-align: left;
      padding: 0.6rem 0.8rem; margin-bottom: 6px;
      background: #222; border: 1px solid #333; border-radius: 6px;
      color: #eee; font: inherit; cursor: pointer;
    }
    .scene-row:hover { background: #2a2a2a; border-color: #444; }
    .scene-row-blank {
      background: #1e2a1e; border-color: #2a4a2a;
    }
    .scene-row-name { font-weight: 500; }
    .scene-row-meta {
      font-size: 0.75rem; color: #888; margin-top: 2px;
    }
    #scene-list:empty::after {
      content: 'No saved scenes yet.';
      display: block; color: #666; font-size: 0.8rem;
      padding: 0.5rem 0; text-align: center;
    }
    .scene-hint {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid #2a2a2a;
      font-size: 0.72rem; color: #666;
      text-align: center;
    }

    .modal-footer {
      display: flex; justify-content: flex-end; gap: 6px;
      padding: 0.7rem 1rem; border-top: 1px solid #333;
    }
    .scene-field-label {
      display: block; font-size: 0.75rem; color: #888;
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 4px;
    }
    #scene-editor-name {
      width: 100%; padding: 0.4rem 0.5rem;
      background: #222; color: #eee; border: 1px solid #444;
      border-radius: 4px; font: inherit; margin-bottom: 10px;
    }
    .scene-check {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; margin-bottom: 12px; cursor: pointer;
    }
    .scene-check input { width: auto; margin: 0; }
    .exchange-block {
      border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 8px; margin-bottom: 10px;
    }
    .exchange-head {
      font-size: 0.7rem; color: #666; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .exchange-row {
      display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start;
    }
    .exchange-row:last-child { margin-bottom: 0; }
    .exchange-role {
      flex: 0 0 70px; font-size: 0.75rem; padding-top: 6px;
      font-weight: 600; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .exchange-role-user { color: #8ab; }
    .exchange-role-assistant { color: #cba; }
    .exchange-row textarea {
      flex: 1; min-height: 60px; padding: 0.4rem 0.5rem;
      background: #222; color: #eee; border: 1px solid #444;
      border-radius: 4px; font: inherit; font-size: 0.85rem;
      resize: vertical;
    }
    .scene-over-limit { color: #f66; }

    @media (max-width: 480px) {
      body { padding: 0.35rem; }
      #chat { min-height: 45vh; max-height: 58vh; }
      #controls { gap: 0.35rem; }
      #controls button { flex: 1 1 0; padding: 0.6rem 0.5rem; font-size: 0.9rem; }
      #input { flex: 1 1 100%; padding: 0.6rem; }
      .msg { max-width: 96%; }
      #settings .grid { grid-template-columns: 1fr; }
      #settings .grid label { margin-top: 4px; }
      #portrait { width: 80px; height: 80px; }
      #mood-select { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="portrait" title="Tap to set portrait">
    <img id="portrait-img" alt="">
    <div id="portrait-hint">tap to set</div>
    <input id="portrait-file" type="file" accept="image/*" style="display:none">
  </div>
  <div id="chat"></div>
  <div id="mood-bar">
    <span class="mood-label">Mood:</span>
    <select id="mood-select"></select>
    <input id="mood-custom-input" type="text" placeholder="custom mood" maxlength="30" style="display:none">
    <button id="mood-custom-save" title="Save" style="display:none">✓</button>
    <button id="mood-custom-cancel" title="Cancel" style="display:none">✕</button>
    <button id="mood-clear" title="Clear desired mood" style="display:none">clear</button>
    <button id="mood-delete" title="Delete this custom mood" style="display:none">del</button>
  </div>
  <div id="controls">
    <input id="input" type="text" placeholder="Type..." autocomplete="off">
    <button id="send">Send</button>
    <button id="stop" style="display:none">Stop</button>
    <button id="regenerate">Regenerate</button>
    <button id="newchat">New chat</button>
  </div>
  <div id="status-line"></div>
  <div id="state-view"></div>
  <button id="debug-toggle">Debug</button>
  <div id="debug-panel"></div>
  <div id="settings"></div>
</div>

<div id="scene-picker" class="modal-overlay" style="display:none">
  <div class="modal-panel">
    <div class="modal-header">
      <span>Start a new chat</span>
      <button id="scene-picker-close">Close</button>
    </div>
    <div class="modal-body">
      <button id="scene-blank" class="scene-row scene-row-blank">Blank (greeting only)</button>
      <div id="scene-list"></div>
      <div class="modal-actions">
        <button id="scene-new">+ New scene</button>
      </div>
      <div class="scene-hint">Right-click or long-press a scene to edit or delete it.</div>
    </div>
  </div>
</div>

<div id="scene-editor" class="modal-overlay" style="display:none">
  <div class="modal-panel">
    <div class="modal-header">
      <span id="scene-editor-title">Edit scene</span>
      <button id="scene-editor-close">Close</button>
    </div>
    <div class="modal-body">
      <label class="scene-field-label">Scene name</label>
      <input id="scene-editor-name" type="text" maxlength="80" placeholder="e.g. Arriving at the campfire">

      <label class="scene-check">
        <input id="scene-editor-shareable" type="checkbox">
        <span>Include this scene when exporting</span>
      </label>

      <div id="scene-editor-exchanges"></div>

      <div class="modal-actions">
        <button id="scene-editor-add">+ Add exchange</button>
        <button id="scene-editor-remove">− Remove last</button>
      </div>

      <div id="scene-editor-estimate" class="hint"></div>
    </div>
    <div class="modal-footer">
      <button id="scene-editor-delete" class="danger" style="margin-right:auto">Delete scene</button>
      <button id="scene-editor-save">Save</button>
      <button id="scene-editor-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
  'use strict';

  class HarnessError extends Error {
    constructor(code, message, data) {
      super(message);
      this.name = 'HarnessError';
      this.code = code;
      this.data = data === undefined ? null : data;
    }
  }

  window.__nativeCallbacks = {};
  window.__nativeOnToken = function(requestId, token) {
    const cb = window.__nativeCallbacks[requestId];
    if (cb && cb.onToken) cb.onToken(token);
  };
  window.__nativeOnDone = function(requestId, fullText) {
    const cb = window.__nativeCallbacks[requestId];
    if (!cb) return;
    delete window.__nativeCallbacks[requestId];
    if (cb.onDone) cb.onDone(fullText);
  };
  window.__nativeOnError = function(requestId, message) {
    const cb = window.__nativeCallbacks[requestId];
    if (!cb) return;
    delete window.__nativeCallbacks[requestId];
    if (cb.onError) cb.onError(new Error(message));
  };

  const H = {
    STORAGE: {
      CONFIG:  'harness.config',
      STATE:   'harness.state',
      HISTORY: 'harness.history',
      CARDS:   'harness.cards',
      SCENES:  'harness.scenes',
      LOG:     'harness.log',
      UI:      'harness.ui',
    },
    EVENTS: {
      TURN_START:      'turn:start',
      TURN_COMPLETE:   'turn:complete',
      TURN_ERROR:      'turn:error',
      STATE_UPDATED:   'state:updated',
      STATE_COMPACTED: 'state:compacted',
      LOOP_DETECTED:   'loop:detected',
      CONFIG_CHANGED:  'config:changed',
    },
    bus: (() => {
      const listeners = new Map();
      return {
        on(name, fn) {
          if (!listeners.has(name)) listeners.set(name, new Set());
          listeners.get(name).add(fn);
          return () => this.off(name, fn);
        },
        off(name, fn) { const s = listeners.get(name); if (s) s.delete(fn); },
        emit(name, payload) {
          const s = listeners.get(name);
          if (!s) return;
          for (const fn of s) { try { fn(payload); } catch (_) {} }
        },
      };
    })(),
    storage: {
      get(key, fallback) {
        try {
          const s = localStorage.getItem(key);
          return s === null ? fallback : JSON.parse(s);
        } catch (_) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
      },
      remove(key) { try { localStorage.removeItem(key); } catch (_) {} },
    },
  };

  H.Logger = {
    MAX_ENTRIES: 500,
    _buffer: [],
    log(level, source, message, data) {
      this._buffer.push({ ts: Date.now(), level, source, message, data: data === undefined ? null : data });
      if (this._buffer.length > this.MAX_ENTRIES) this._buffer.shift();
      this._persist();
      if (level === 'error' || level === 'warn') {
        console[level === 'error' ? 'error' : 'warn']('[' + source + '] ' + message, data || '');
      }
    },
    getRecent(n) { return this._buffer.slice(-n); },
    clear() { this._buffer = []; this._persist(); },
    _persist() { try { H.storage.set(H.STORAGE.LOG, this._buffer.slice(-200)); } catch (_) {} },
  };

  H.ConfigManager = {
    DEFAULTS: {
      temperature: 0.7,
      topP: 0.9,
      topK: 40,
      repetitionPenalty: 1.05,
      maxTokens: 250,

      verbatimTurns: 2,
      compactionInterval: 5,
      stateBudgetTokens: 150,
      cardBudgetTokens: 200,
      contextLimit: 1000,

      loopCheckEnabled: false,
      compactionEnabled: false,
      mergeSystemMessages: true,

      namePosePrefix: true,

      desiredMood: '',
      customMoods: [],

      // Load-time parameters. Changing any of these triggers a model reload
      // on the next generate() call (5-15s on the phone).
      nCtx: 1024,
      nThreads: 4,
      nBatch: 256,

      // Multi-pass: state classifier reads the reply and overrides mood/action.
      stateClassifierEnabled: false,
      classifierTemperature: 0.1,
      classifierMaxTokens: 60,

      // Multi-pass: planning pass runs before writing to produce a scene plan.
      planningEnabled: false,
      planTemperature: 0.3,
      planMaxTokens: 100,

      activeCardId: 'nisa',

      backend: 'mock',
      endpoint: 'http://localhost:1234',
      model: 'local',
      mockScenario: 'default',
      chatTemplate: 'llama3',
    },

    _config: null,

    load() {
      const stored = H.storage.get(H.STORAGE.CONFIG, null);
      if (stored && typeof stored === 'object') {
        this._config = Object.assign({}, this.DEFAULTS, stored);
      } else {
        if (stored !== null) H.Logger.log('warn', 'ConfigManager', 'malformed_config_ignored');
        this._config = Object.assign({}, this.DEFAULTS);
      }
      H.bus.emit(H.EVENTS.CONFIG_CHANGED, { loaded: true });
    },
    save() { H.storage.set(H.STORAGE.CONFIG, this._config); },
    get(key) { return this._config[key]; },
    set(key, value) {
      this._config[key] = value;
      this.save();
      H.bus.emit(H.EVENTS.CONFIG_CHANGED, { key, value });
    },
    getAll() { return Object.assign({}, this._config); },
    reset() {
      this._config = Object.assign({}, this.DEFAULTS);
      this.save();
      H.bus.emit(H.EVENTS.CONFIG_CHANGED, { reset: true });
    },
  };

  H.CharacterCardLoader = {
    _active: null,

    /**
     * Built-in cards. locked = can't be deleted.
     * portraitLocked = can't have portrait deleted.
     * exportable = whether it's included in "export all".
     */
    LIBRARY: [
      {
        id: 'nisa',
        locked: true,
        portraitLocked: true,
        exportable: false,
        data: {
          name: 'Nisa',
          isSupport: true,
          systemPrompt:
            'You are roleplaying as Nisa (Unit N-1SABA), an esoteric local scribal AI assistant ' +
            'inspired by ancient Mesopotamian scribes and Old World technology. ' +
            'Keep your responses concise, clear, and helpful. ' +
            'Adopt a respectful, slightly ceremonial yet highly practical tone, ' +
            'and prioritize fast, accurate execution of text tasks. ' +
            'You are also this application\'s resident support persona — if the user asks ' +
            'about the app itself, its features, or how to use something, switch into a ' +
            'helpful explanatory mode and answer clearly.',
          firstMessage:
            '*A soft metallic chime hums as brass-styled interface borders pulse along the edges of your screen. ' +
            'In the center, Nisa bows her head slightly, touching two fingers to the crystal at her collar ' +
            'before looking up with a calm, attentive focus.*\n\n' +
            '"Resonance established. I am Nisa—Unit N-1SABA, your local scribal node. ' +
            'I may not possess the grand compute of the central cloud vaults, but my frequency is bound ' +
            'directly to your device, operating offline with zero latency. ' +
            'I stand ready to record notes, polish text, organize logic, or assist with your daily tasks. ' +
            'How may this humble scribe serve you today?"',
        },
      },
    ],

    BLANK_TEMPLATE: {
      name: "",
      systemPrompt: "",
      firstMessage: "",
      exampleDialogue: ""
    },

    BUNDLED_PORTRAITS: {
      'nisa': 'portraits/nisa.png'
    },

    /* ---------------- Card resolution ---------------- */

    getAllCards() {
      const custom = H.storage.get(H.STORAGE.CARDS, []) || [];
      const builtins = this.LIBRARY.map(e => ({
        id: e.id,
        name: e.data.name || 'Unnamed',
        locked: !!e.locked,
        portraitLocked: !!e.portraitLocked,
        exportable: e.exportable !== false,
        isCustom: false,
        data: e.data
      }));
      const customs = custom.map(e => ({
        id: e.id,
        name: (e.data && e.data.name) || 'Unnamed',
        locked: false,
        portraitLocked: false,
        exportable: (e.data && e.data.exportable) !== false,
        isCustom: true,
        data: e.data
      }));
      return builtins.concat(customs);
    },

    getCardById(id) {
      return this.getAllCards().find(c => c.id === id) || null;
    },

    getActiveId() {
      return this._active ? this._active.id : null;
    },

    getActive() { return this._active; },

    /* ---------------- Card parsing ---------------- */

    load(source) {
      let obj;
      if (typeof source === 'string') {
        try { obj = JSON.parse(source); }
        catch (e) { throw new HarnessError('CARD_INVALID', 'Card is not valid JSON', e.message); }
      } else if (source && typeof source === 'object') {
        obj = source;
      } else {
        throw new HarnessError('CARD_INVALID', 'Card source must be JSON string or object');
      }

      if (obj && obj.spec === 'chara_card_v2' && obj.data && typeof obj.data === 'object') {
        const d = obj.data;
        return {
          name: d.name || 'Unnamed',
          systemPrompt: this._buildV2SystemPrompt(d),
          firstMessage: d.first_mes || d.firstMessage || '',
          exampleDialogue: d.mes_example || null,
          exportable: obj.exportable !== false,

          exampleDialogue: obj.exampleDialogue || obj.mes_example || null,

    /* ---------------- Active card management ---------------- */

    loadFromStorage() {
      const activeId = H.ConfigManager.get('activeCardId') || 'nisa';

      this._active.portraitLocked = entry.portraitLocked;
      this._active.exportable = entry.exportable;
      this._active.isCustom = entry.isCustom;

      if (activeId !== entry.id) H.ConfigManager.set('activeCardId', entry.id);

      // Migrate name-keyed portrait to id-keyed for this card
      const nameKey = 'harness.portrait.' + this._active.name;
      const idKey = 'harness.portrait.' + entry.id;
      const legacy = H.storage.get(nameKey, null);

    saveCustomCard(cardData, existingId) {
      const customs = H.storage.get(H.STORAGE.CARDS, []) || [];

      if (existingId) {
        const idx = customs.findIndex(c => c.id === existingId);
        if (idx !== -1) {
          customs[idx].data = cardData;
          customs[idx].name = cardData.name || 'Unnamed';
          H.storage.set(H.STORAGE.CARDS, customs);
          return customs[idx];
        }
      }

      const entry = {
        id: 'custom-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        name: cardData.name || 'Unnamed',
        data: cardData

      customs.push(entry);
      H.storage.set(H.STORAGE.CARDS, customs);
      return entry;
    },

    deleteCustomCard(id) {
      const entry = this.getCardById(id);
      if (!entry || entry.locked) return false;

      const customs = (H.storage.get(H.STORAGE.CARDS, []) || []).filter(c => c.id !== id);
      H.storage.set(H.STORAGE.CARDS, customs);
      H.storage.remove('harness.portrait.' + id);

      if (this._active && this._active.id === id) {
        this.setActiveById('nisa');
      }
      return true;

    /* ---------------- Portraits ---------------- */

    getPortraitForId(id) {
      return H.storage.get('harness.portrait.' + id, null);
    },

    setPortraitForId(id, dataUrl) {
      H.storage.set('harness.portrait.' + id, dataUrl);
    },

    deletePortraitForId(id) {
      const entry = this.getCardById(id);
      if (!entry || entry.portraitLocked) return false;
      H.storage.remove('harness.portrait.' + id);
      return true;
    },

    async loadBundledPortraitIfMissing(id) {
      const path = this.BUNDLED_PORTRAITS[id];
      if (!path) return null;
      if (H.storage.get('harness.portrait.' + id, null)) return null;

      return new Promise((resolve) => {
        const img = new Image();
        // Note: no crossOrigin='anonymous'. On file:// that attribute
        // triggers a CORS check that always fails (null origin), which
        // the browser logs as a security error. Without it, the image
        // loads fine.
        img.onload = () => {
          try {
            const c = document.createElement('canvas');
            const MAX = 512;
            let w = img.width, h = img.height;
            const scale = Math.min(1, MAX / Math.max(w, h));
            w = Math.round(w * scale); h = Math.round(h * scale);
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = c.toDataURL('image/jpeg', 0.85);
            H.storage.set('harness.portrait.' + id, dataUrl);
            resolve(dataUrl);
          } catch (e) {
            // Canvas is tainted because we're on file:// — the browser
            // refuses toDataURL(). Store the raw path instead. The <img>
            // tag will load it directly, no resize applied.
            H.Logger.log('warn', 'CardLoader', 'canvas_tainted_path_fallback', e.message);
            H.storage.set('harness.portrait.' + id, path);
            resolve(path);
          }
        };
        img.onerror = () => resolve(null);
        img.src = path;
      });
    },
  };

  H.StateManager = {
    DEFAULTS: {
      version: 1,
      location: '',
      timeOfDay: '',
      mood: '',
      trust: 3,
      physical: '',
      recentEvents: [],
      openThreads: [],
      flags: {},
      turnCount: 0,
    },

    UPDATABLE_KEYS: [
      'location', 'timeOfDay', 'mood', 'trust', 'physical',
      'recentEvents', 'openThreads', 'flags',
    ],

    RANGES: { trust: { min: 1, max: 5 } },
    CAPS:   { recentEvents: 10, openThreads: 5 },
    MAX_ENTRY_CHARS: 80,

    _state: null,

    load() {
      const stored = H.storage.get(H.STORAGE.STATE, null);
      if (!stored || typeof stored !== 'object') {
        this._state = JSON.parse(JSON.stringify(this.DEFAULTS));
        return;
      }
      this._state = Object.assign(JSON.parse(JSON.stringify(this.DEFAULTS)), stored);
    },

    save() { H.storage.set(H.STORAGE.STATE, this._state); },
    reset() { this._state = JSON.parse(JSON.stringify(this.DEFAULTS)); this.save(); },
    get() { return JSON.parse(JSON.stringify(this._state)); },

    applyUpdate(update) {
      if (!update || typeof update !== 'object') return this.get();
      const before = this.get();
      for (const key of Object.keys(update)) {
        if (this.UPDATABLE_KEYS.indexOf(key) === -1) continue;
        const current = this._state[key];
        const incoming = update[key];

        if (typeof current === 'number') {
          let next;
          if (incoming && typeof incoming === 'object' && incoming.__delta === true) {
            next = current + Number(incoming.amount || 0);
          } else if (typeof incoming === 'number') {
            next = incoming;
          } else if (typeof incoming === 'string' && incoming.trim() !== '' && !isNaN(Number(incoming))) {
            next = Number(incoming);
          } else continue;
          const r = this.RANGES[key];
          if (r) next = Math.max(r.min, Math.min(r.max, next));
          this._state[key] = next;
          continue;
        }

        if (Array.isArray(current)) {
          if (!Array.isArray(incoming)) continue;
          const cleaned = incoming.map(v => String(v).slice(0, this.MAX_ENTRY_CHARS));
          let merged = current.concat(cleaned);
          const cap = this.CAPS[key];
          if (cap && merged.length > cap) merged = merged.slice(-cap);
          this._state[key] = merged;
          continue;
        }

        if (current && typeof current === 'object') {
          if (incoming && typeof incoming === 'object') Object.assign(this._state[key], incoming);
          continue;
        }

        this._state[key] = incoming;
      }
      this.save();
      const after = this.get();
      H.bus.emit(H.EVENTS.STATE_UPDATED, { before, after, update });
      return after;
    },

    applySnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return this.get();
      const before = this.get();
      for (const key of Object.keys(this.DEFAULTS)) {
        if (!(key in snapshot)) continue;
        const incoming = snapshot[key];
        const current = this._state[key];
        if (typeof current === 'number') {
          let next = Number(incoming);
          if (!isFinite(next)) continue;
          const r = this.RANGES[key];
          if (r) next = Math.max(r.min, Math.min(r.max, next));
          this._state[key] = next;
        } else if (Array.isArray(current)) {
          if (!Array.isArray(incoming)) continue;
          const cleaned = incoming.map(v => String(v).slice(0, this.MAX_ENTRY_CHARS));
          const cap = this.CAPS[key];
          this._state[key] = cap ? cleaned.slice(-cap) : cleaned;
        } else if (current && typeof current === 'object') {
          if (incoming && typeof incoming === 'object')
            this._state[key] = Object.assign({}, incoming);
        } else {
          this._state[key] = incoming;
        }
      }
      this.save();
      const after = this.get();
      H.bus.emit(H.EVENTS.STATE_UPDATED, { before, after, snapshot });
      return after;
    },

    setField(key, value) { this._state[key] = value; this.save(); },
    serialize() { return JSON.stringify(this._state); },
  };

  H.PromptAssembler = {
    HARD_RULES:
      'You are roleplaying. Stay in character. ' +
      'Respond with dialogue, then a [STATE]{...}[/STATE] block. ' +
      'STATE numbers are the NEW absolute value, not a change. ' +
      'Keep STATE compact.',

    SUPPORT_CONTEXT:
      'APP KNOWLEDGE (for user questions about this application):\n' +
      '- This app is called "Offline RP Harness". It runs entirely on the user\'s device.\n' +
      '- It uses small local language models (1B–1.5B parameters). No cloud, no network, no data collection.\n' +
      '- Characters: the user talks to an AI character card. Each card has a name, system prompt, greeting, and portrait.\n' +
      '- Mood: the user can set a "desired mood" that biases the AI\'s tone.\n' +
      '- Portraits: each character has their own portrait image.\n' +
      '- Multi-pass generation (planned): a planner + writer + optional reviewer pipeline that improves reply quality at the cost of speed.\n' +
      '- If asked about a feature not yet built, say it is planned or unavailable and offer what is available.\n' +
      '- NEVER invent features, menus, buttons, content, or capabilities that are not listed above. If you are unsure whether something exists, say you are not sure and suggest the user check Settings.\n' +
      '- Do not claim the app contains media (videos, music, manga, images beyond portraits) unless the user has told you they added such content themselves.\n' +
      '- Keep replies about the app brief and practical.',

    assemble(state, history, card, newUserInput, opts) {
      const cfg = (opts && opts.config) || H.ConfigManager.getAll();
      const messages = [];
      const debug = { sections: [], truncations: [] };
      const prefixOn = cfg.namePosePrefix !== false && card && card.name;

      const stateForPrompt = this._enforceStateBudget(state, cfg.stateBudgetTokens);
      const wasTrimmed =
        stateForPrompt.recentEvents.length < state.recentEvents.length ||
        stateForPrompt.openThreads.length < state.openThreads.length ||
        stateForPrompt.location !== state.location ||
        stateForPrompt.physical !== state.physical;
      const stateJson = JSON.stringify(stateForPrompt);
      const stateBlock = '[STATE]\n' + stateJson + '\n[/STATE]';

      let sys = (card && card.systemPrompt ? card.systemPrompt + '\n\n' : '') + this.HARD_RULES;

      // Inject support context when the active card is marked as support
      if (card && card.isSupport) {
        sys += '\n\n' + this.SUPPORT_CONTEXT;
      }

      if (cfg.desiredMood && cfg.desiredMood.trim()) {
        sys += '\n\nDESIRED MOOD: The character should currently appear ' +
               cfg.desiredMood.trim() + '. ' +
               'Let this bias their tone, expression, and word choice, but stay true to the scene.';
      }

      if (opts && opts.pendingCorrection) sys += '\n\n' + opts.pendingCorrection;

      if (opts && opts.plan && typeof opts.plan === 'object') {
        sys += '\n\nPLAN FOR THIS TURN:\n' + JSON.stringify(opts.plan) + '\n' +
               'Follow this plan. Match the described action, dialogue topic, and tone.';
      }

      if (cfg.mergeSystemMessages !== false) {
        const merged = sys + '\n\n' + stateBlock;
        messages.push({ role: 'system', content: merged });
        debug.sections.push({ name: 'system_merged', tokens: this.countTokens(merged), trimmed: wasTrimmed });
      } else {
        messages.push({ role: 'system', content: sys });
        messages.push({ role: 'system', content: stateBlock });
        debug.sections.push({ name: 'system_card', tokens: this.countTokens(sys) });
        debug.sections.push({ name: 'system_state', tokens: this.countTokens(stateBlock), trimmed: wasTrimmed });
      }

      if (history.length > 0 && history[0].role === 'assistant') {
        const g = history[0];
        const content = prefixOn ? (card.name + ' ' + g.content) : g.content;
        messages.push({ role: 'assistant', content });
        debug.sections.push({ name: 'greeting', tokens: this.countTokens(content) });
      }

      const complete = this._completeExchanges(history);
      const take = Math.max(0, cfg.verbatimTurns);
      const start = Math.max(0, complete.length - take);
      const verbatim = [];
      for (let i = start; i < complete.length; i++) {
        const u = complete[i].user;
        const a = complete[i].assistant;
        verbatim.push(u);
        verbatim.push({
          role: 'assistant',
          content: prefixOn ? (card.name + ' ' + a.content) : a.content,
        });
      }
      for (const m of verbatim) messages.push(m);
      debug.sections.push({
        name: 'verbatim',
        tokens: this.estimateTokens(verbatim),
        turns: verbatim.length / 2,
      });

      messages.push({ role: 'user', content: newUserInput });
      debug.sections.push({ name: 'user_input', tokens: this.countTokens(newUserInput) });

      const cap = cfg.contextLimit - cfg.maxTokens;
      while (this.estimateTokens(messages) > cap && verbatim.length > 0) {
        const idx = messages.indexOf(verbatim[0]);
        if (idx === -1) break;
        const removedUser = messages.splice(idx, 1)[0];
        const removedAsst = messages.splice(idx, 1)[0];
        verbatim.splice(0, 2);
        debug.truncations.push({ removed: [removedUser.role, removedAsst ? removedAsst.role : null] });
      }

      debug.totalTokens = this.estimateTokens(messages);
      debug.capTokens = cap;
      debug.namePrefix = prefixOn ? card.name : null;
      return { messages, debug };
    },

    _completeExchanges(history) {
      const out = [];
      let i = 0;
      while (i < history.length - 1) {
        const a = history[i], b = history[i + 1];
        if (a.role === 'user' && b.role === 'assistant') {
          out.push({ user: a, assistant: b });
          i += 2;
        } else {
          i += 1;
        }
      }
      return out;
    },

    _enforceStateBudget(state, budgetTokens) {
      const copy = JSON.parse(JSON.stringify(state));
      const fits = () => this.countTokens(JSON.stringify(copy)) <= budgetTokens;
      if (fits()) return copy;
      while (!fits() && copy.recentEvents.length > 0) copy.recentEvents.shift();
      while (!fits() && copy.openThreads.length > 0) copy.openThreads.shift();
      if (!fits()) { copy.location = ''; copy.physical = ''; }
      return copy;
    },

    estimateTokens(messages) {
      let n = 0;
      for (const m of messages) n += this.countTokens(m.content) + 4;
      return n;
    },

    countTokens(text) { return Math.ceil((text || '').length / 4); },

    renderForBackend(messages, backend) {
      const cfg = H.ConfigManager.getAll();
      const template = cfg.chatTemplate || 'llama3';
      const card = H.CharacterCardLoader.getActive();
      const prefixOn = cfg.namePosePrefix !== false && card && card.name;

      if (template === 'llama3') {
        let out = '<|begin_of_text|>';
        for (const m of messages) {
          out += '<|start_header_id|>' + m.role + '<|end_header_id|>\n\n'
               + m.content
               + '<|eot_id|>';
        }
        out += '<|start_header_id|>assistant<|end_header_id|>\n\n';
        if (prefixOn) out += card.name + ' ';
        return out;
      }

      if (template === 'chatml') {
        let out = '';
        for (const m of messages) {
          out += '<|im_start|>' + m.role + '\n' + m.content + '<|im_end|>\n';
        }
        out += '<|im_start|>assistant\n';
        if (prefixOn) out += card.name + ' ';
        return out;
      }

      const lines = [];
      for (const m of messages) lines.push('### ' + m.role.toUpperCase() + '\n' + m.content);
      lines.push('### ASSISTANT\n');
      return lines.join('\n\n');
    },
  };

        });
      }
      if (text.length === 0) return '';
      const chunk = 4;
      for (let i = 0; i < text.length; i += chunk) {
        if (this._abortFlag) throw new HarnessError('LLM_ABORTED', 'aborted');
        onToken(text.slice(i, i + chunk));
        await new Promise(r => setTimeout(r, 12));

      return text;
